<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri d'équipement · Watcher of Realms</title>
<!--
  Watcher of Realms — gestionnaire de règles de tri d'équipement
  SPA autonome : aucune dépendance, données 100 % locales. Seule exception réseau, au clic
  « Partager » : raccourcisseur TinyURL (secours da.gd, repli lien long si tout est injoignable).
  Persistance : stockage Claude quand disponible, sinon bascule automatique sur localStorage (PC & mobile).
  Partage / sauvegarde : export & import JSON par onglet (bouton « exporter » sur la barre d'onglets,
  « Importer des règles » dans le menu). Un lien de partage #/import=… est décodé au chargement (utile une fois hébergé).
-->
<style>
  :root{
    --bg:#14121a; --bg-side:#100e15; --panel:#1d1a24; --panel2:#262230;
    --border:#35303f; --border-soft:#2a2632;
    --ink:#ece7db; --muted:#9a92a6; --faint:#6f6880;
    --t3:#e0635a; --t2:#e2b04a; --t1:#a678e8; --t0:#5f9fd6; --t4:#4ef08a;
    --off:#cf6054; --deff:#5f9fd6; --util:#6fbf8f;
    --acc:#e2b04a; --acc-bd:rgba(226,176,74,.5); --acc-dim:rgba(226,176,74,.14); --acc-glow:rgba(226,176,74,.05); --radius:12px;
    --display:"Palatino Linotype","Iowan Old Style",Palatino,"Book Antiqua",Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  body.light{
    --bg:#f4f1e8; --bg-side:#ebe7db; --panel:#fdfcf8; --panel2:#efece2;
    --border:#cfc8b8; --border-soft:#ddd7c9;
    --ink:#2c2735; --muted:#6a6276; --faint:#948da1;
    --t3:#b02a24; --t2:#a1720e; --t1:#7a3fd4; --t0:#2f6ea8; --t4:#0f9d46;
    --off:#b23a2e; --deff:#2f6ea8; --util:#2e7d4f;
    --acc:#a1720e; --acc-bd:rgba(161,114,14,.45); --acc-dim:rgba(161,114,14,.12); --acc-glow:rgba(161,114,14,.06);
  }
  body.light main#view{background-image:radial-gradient(ellipse 800px 380px at 55% -90px,var(--acc-glow),transparent)}
  body.light .chip.off{color:#a63a2e}
  body.light .chip.deff{color:#2f6ea8}
  body.light .chip.util{color:#2e7d4f}
  body.light .chip.set.t3,body.light .tier-badge.b3{color:var(--t3)}
  body.light .chip.set.t1,body.light .tier-badge.b1{color:var(--t1)}
  body.light .chip.set.t0,body.light .tier-badge.b0{color:var(--t0)}
  body.light .chk:checked::after{color:#fff}
  body.light .toast{box-shadow:0 8px 24px rgba(60,50,30,.18)}
  body.light .overlay{background:rgba(50,42,60,.35)}
  /* ── Accents au choix (or par défaut) ── */
  body[data-acc="vert"]{--acc:#5cc492;--acc-bd:rgba(92,196,146,.5);--acc-dim:rgba(92,196,146,.13);--acc-glow:rgba(92,196,146,.05)}
  body[data-acc="bleu"]{--acc:#6db2ef;--acc-bd:rgba(109,178,239,.5);--acc-dim:rgba(109,178,239,.13);--acc-glow:rgba(109,178,239,.06)}
  body[data-acc="violet"]{--acc:#b691f0;--acc-bd:rgba(182,145,240,.5);--acc-dim:rgba(182,145,240,.13);--acc-glow:rgba(182,145,240,.06)}
  body[data-acc="rouge"]{--acc:#d46a7c;--acc-bd:rgba(212,106,124,.5);--acc-dim:rgba(212,106,124,.13);--acc-glow:rgba(212,106,124,.06)}
  body.light[data-acc="vert"]{--acc:#1e7d4f;--acc-bd:rgba(30,125,79,.45);--acc-dim:rgba(30,125,79,.11);--acc-glow:rgba(30,125,79,.06)}
  body.light[data-acc="bleu"]{--acc:#2264a8;--acc-bd:rgba(34,100,168,.45);--acc-dim:rgba(34,100,168,.11);--acc-glow:rgba(34,100,168,.06)}
  body.light[data-acc="violet"]{--acc:#6a3fc4;--acc-bd:rgba(106,63,196,.45);--acc-dim:rgba(106,63,196,.11);--acc-glow:rgba(106,63,196,.06)}
  body.light[data-acc="rouge"]{--acc:#8e2c48;--acc-bd:rgba(142,44,72,.45);--acc-dim:rgba(142,44,72,.11);--acc-glow:rgba(142,44,72,.06)}
  body[data-density="compact"] .row-head{padding:8px 12px;gap:9px}
  body[data-density="compact"] .rule{margin:6px 0}
  body[data-density="compact"] .panel{padding:12px 14px;margin:12px 0}
  body[data-density="compact"] .view-head{margin-bottom:14px}
  body[data-density="compact"] h3.grp-head{margin:18px 0 7px}
  body[data-density="compact"] .controls{padding:8px 10px;gap:9px 14px;margin:12px 0 8px}
  body[data-density="compact"] .cov-card,body[data-density="compact"] .stat-card{padding:9px 12px}
  body[data-density="compact"] .piece-grid{gap:7px}
  body[data-density="compact"] .rb-grid{gap:5px 13px}
  .acc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0}
  .acc-dots{display:flex;align-items:center;gap:7px}
  .seg-lang{padding:1px;gap:1px}
  /* .seg button (plus bas) a la même spécificité : on double la classe pour que la casse normale gagne */
  .seg.seg-lang button{padding:2px 7px;font-size:10px;font-family:var(--mono);font-variant:normal;text-transform:none;letter-spacing:.03em}
  .acc-dot{appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;flex:0 0 auto;transition:transform .12s,border-color .12s,box-shadow .12s}
  .acc-dot:hover{transform:scale(1.12)}
  .acc-dot.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--acc-dim)}
  .acc-dot:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  /* ── Groupes de contrôles étiquetés & rangées scrollables ── */
  .ctl{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
  .ctl-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
  .ctl-label svg{opacity:.65;flex:0 0 auto}
  .arch-wrap{display:inline-flex;align-items:center;gap:2px}
  .arch-del{appearance:none;border:none;background:none;color:var(--faint);cursor:pointer;font-size:10px;padding:0 3px;line-height:1}
  .arch-del:hover{color:var(--off)}
  .arch-input{width:140px;font-size:13px;padding:4px 9px}
  .tabs-main{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
  .tabs-scroll{flex:1 1 auto;display:flex;align-items:center;gap:6px;overflow-x:auto;min-width:0;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .fchips>.chip{flex:0 0 auto;margin:2px 0}
  .fchips::-webkit-scrollbar,.tabs-scroll::-webkit-scrollbar{height:5px}
  .fchips::-webkit-scrollbar-thumb,.tabs-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .fchips::-webkit-scrollbar-track,.tabs-scroll::-webkit-scrollbar-track{background:transparent}
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
  ::selection{background:var(--acc-dim)}
  button{font:inherit;color:inherit}

  /* ── Structure ── */
  .app{display:grid;grid-template-columns:242px 1fr;height:100vh}
  aside.side{background:var(--bg-side);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;
    padding:18px 14px 14px;gap:6px;overflow-y:auto}
  main#view{overflow-y:auto;overflow-x:hidden;padding:26px 30px 90px;scroll-behavior:smooth;
    background-image:radial-gradient(ellipse 800px 380px at 55% -90px,var(--acc-glow),transparent)}
  .wrap{max-width:1060px;margin:0 auto}

  /* ── Sidebar ── */
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
  .brand .diamond{color:var(--acc);font-size:17px}
  .brand h1{font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-weight:600;font-size:17px;line-height:1.15}
  .brand .sub{color:var(--faint);font-size:11px;margin-top:1px}
  nav.mainnav{display:flex;flex-direction:column;gap:2px}
  .nav-btn{display:flex;align-items:center;gap:10px;appearance:none;background:none;border:none;border-left:2px solid transparent;
    color:var(--muted);font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-size:15px;
    padding:9px 10px;border-radius:0 8px 8px 0;cursor:pointer;text-align:left;transition:color .15s,background .15s}
  .nav-btn svg{flex:0 0 auto;opacity:.75}
  .nav-btn:hover{color:var(--ink);background:rgba(255,255,255,.025)}
  .nav-btn.active{color:var(--acc);border-left-color:var(--acc);background:var(--acc-dim)}
  .nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);
    border:1px solid var(--border-soft);border-radius:10px;padding:0 7px}
  .nav-btn.active .count{color:var(--acc);border-color:var(--acc-bd)}
  .nav-btn:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 8px 2px;border-top:1px solid var(--border-soft)}
  .prog-label{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted)}
  .prog-label b{font-family:var(--mono);color:var(--acc);font-weight:600}
  .prog-bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .prog-bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
  .side-btn{appearance:none;background:var(--panel);border:1px solid var(--border);color:var(--muted);
    font-family:var(--mono);font-size:11.5px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .15s;text-align:center}
  .side-btn:hover{color:var(--acc);border-color:var(--acc-bd)}
  .side-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .save-line{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--faint);font-size:10.5px;min-height:15px}
  .save-line .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .save-line.ok .dot{background:var(--util)}
  .save-line.warn .dot{background:var(--off)}

  /* ── En-tête de vue ── */
  .view-head{margin-bottom:20px}
  .view-head h2{font-family:var(--display);font-variant:small-caps;letter-spacing:.06em;font-weight:600;font-size:23px}
  .view-head .lede{color:var(--muted);font-size:13px;margin-top:3px;max-width:760px}
  h3.grp-head{font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-weight:600;font-size:15.5px;
    color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px;position:sticky;top:-26px;
    background:var(--bg);padding:6px 0;z-index:5}
  h3.grp-head::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
  h3.grp-head .n{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ── Onglets de jeux de règles ── */
  .tabs{display:flex;flex-direction:column;align-items:stretch;gap:7px;margin-bottom:8px}
  .tab-btn{appearance:none;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);font-family:var(--display);font-variant:small-caps;letter-spacing:.04em;font-size:14.5px;
    padding:7px 14px;border-radius:9px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap}
  .tab-btn:hover{color:var(--ink)}
  .tab-btn.on{color:var(--acc);border-color:var(--acc-bd);background:var(--acc-dim)}
  .tab-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .tab-btn .n{font-family:var(--mono);font-size:10.5px;opacity:.8}
  .tab-add{appearance:none;background:none;border:1px dashed var(--border);color:var(--faint);width:32px;height:32px;
    border-radius:9px;cursor:pointer;font-size:15px;line-height:1;transition:all .15s}
  .tab-add:hover{color:var(--acc);border-color:var(--acc-bd)}
  .tab-add:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .tab-rename{background:var(--panel2);border:1px solid var(--acc-bd);border-radius:9px;color:var(--ink);
    font:inherit;font-size:14px;padding:6px 10px;width:190px}
  .tab-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
  .key-row{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;align-self:flex-start;margin-top:3px;
    padding:7px 12px;background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--acc);border-radius:9px}
  .key-input{background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:5px 10px;flex:0 0 auto;width:13ch}
  .key-input::placeholder{color:var(--faint);font-family:var(--body)}
  .tsep{width:1px;background:var(--border);margin:2px 4px;flex:0 0 auto}

  /* ── Segmented + filtres + toolbar ── */
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
  .seg button{appearance:none;background:none;border:none;color:var(--muted);font-family:var(--display);font-variant:small-caps;
    letter-spacing:.04em;font-size:14px;padding:5px 14px;border-radius:7px;cursor:pointer;transition:all .15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--acc-dim);color:var(--acc)}
  .seg button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin:16px 0 10px;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:11px 14px}
  .controls-acc{margin:14px 0 10px}
  .controls-acc>summary.p-sum{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-size:14.5px;font-weight:600;color:var(--muted);
    padding:4px 8px 4px 2px;border-radius:7px}
  .controls-acc>summary.p-sum:hover{color:var(--ink)}
  .controls-acc>summary.p-sum .n{font-family:var(--mono);font-size:10.5px;color:var(--acc);border:1px solid var(--acc-bd);border-radius:10px;padding:0 7px}
  .controls-acc>.controls{margin:6px 0 0}
  .hint ul{list-style:none;margin:0;padding:0}
  .hint li{padding:2px 0 2px 15px;position:relative}
  .hint li::before{content:"◆";position:absolute;left:0;top:7px;font-size:7px;color:var(--faint)}
  .search{position:relative;width:min(360px,100%);min-width:200px}
  .search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--ink);
    padding:8px 12px 8px 32px;font:inherit;font-size:13.5px}
  .search input::placeholder{color:var(--faint)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
  input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  select{background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--ink);padding:6px 9px;font:inherit;font-size:13px}
  .fchips{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .fchip{appearance:none;background:var(--panel);border:1px solid var(--border);color:var(--muted);
    font-family:var(--mono);font-size:11.5px;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s;flex:0 0 auto;white-space:nowrap}
  .fchip:hover{color:var(--ink)}
  /* rôles hors .fchips (carte de règle, éditeur) : en flux inline, sans marge les lignes se collent */
  .rb-grid .fchip,#ap-arch .fchip,#ap-arch .arch-wrap{margin:2px 4px 2px 0}
  .fchip.on{color:var(--acc);border-color:var(--acc-bd);background:var(--acc-dim)}
  .fchip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
  .btn{appearance:none;background:var(--panel);border:1px solid var(--border);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
  .btn:hover{border-color:var(--acc-bd);color:var(--acc)}
  .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .btn.primary{background:var(--acc-dim);border-color:var(--acc-bd);color:var(--acc);font-weight:600}
  .btn.primary:hover{background:var(--acc-dim);border-color:var(--acc)}
  .btn.danger:hover{border-color:var(--off);color:var(--off)}
  .btn.arm{color:#fff!important;background:var(--off);border-color:var(--off)!important}
  .hint{color:var(--faint);font-size:12px;margin:8px 0 0}
  .hint b{color:var(--muted);font-weight:600}

  /* ── Lignes de règles ── */
  .rule-list{margin-top:4px}
  .rule{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    border-left:3px solid var(--acc);margin:9px 0;transition:border-color .15s;overflow:hidden}
  .rule:hover{border-color:var(--border);border-left-color:var(--acc)}
  .rule.s-t1{border-left-color:var(--t1)}
  .rule.s-t1:hover{border-left-color:var(--t1)}
  .rule.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--acc)}100%{box-shadow:none}}
  .row-head{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
  .row-head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .chk{appearance:none;flex:0 0 auto;width:17px;height:17px;border:1.5px solid var(--faint);border-radius:5px;
    background:transparent;cursor:pointer;position:relative;transition:all .15s}
  .chk:hover{border-color:var(--acc)}
  .chk:checked{background:var(--acc);border-color:var(--acc)}
  .chk:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#1c1608;font-size:12px;font-weight:700}
  .chk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .rc-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-dim);
    border:1px solid var(--acc-bd);border-radius:5px;padding:2px 8px;flex:0 0 auto}
  .s-t1 .rc-id{color:#8fbde4;background:rgba(95,159,214,.1);border-color:rgba(95,159,214,.35)}
  .rc-name{font-family:var(--display);font-variant:small-caps;letter-spacing:.03em;font-size:16px;font-weight:600}
  .role{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--border-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
  .row-mains{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:2px}
  .row-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .minis{display:flex;gap:3px}
  .mini{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
  .mini.e{color:var(--acc);border-color:var(--acc-bd)}
  .dots{display:flex;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint)}
  .dot.fill{background:var(--acc);border-color:var(--acc)}
  .s-t1 .dot.fill{background:var(--t1);border-color:var(--t1)}
  .drag{cursor:grab;color:var(--faint);font-size:13px;line-height:1;flex:0 0 auto;user-select:none;padding:2px 3px 2px 0}
  .drag:hover{color:var(--acc)}
  .rule.dragging{opacity:.45}
  .rule.drop-before{box-shadow:0 -3px 0 0 var(--acc)}
  .rule.drop-after{box-shadow:0 3px 0 0 var(--acc)}
  .chev{flex:0 0 auto;transition:transform .2s;opacity:.55}
  .rule.open .chev{transform:rotate(180deg)}
  .row-body{display:none;padding:2px 16px 14px 45px;border-top:1px dashed var(--border-soft)}
  .rule.open .row-body{display:block}
  .rb-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;margin-top:10px}
  .rb-grid .k{color:var(--faint);font-family:var(--display);font-variant:small-caps;letter-spacing:.04em;font-size:13px;white-space:nowrap;padding-top:2px}
  .chip{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:5px;
    border:1px solid var(--border);background:var(--panel2);color:var(--ink);margin:2px 3px 2px 0;white-space:nowrap}
  .chip.off{border-color:rgba(207,96,84,.5);color:#e8968c}
  .chip.deff{border-color:rgba(95,159,214,.5);color:#93c1e8}
  .chip.util{border-color:rgba(111,191,143,.5);color:#9ed9b4}
  .chip.set{font-family:var(--body);font-size:12px;background:transparent}
  .chip.set.t3{border-color:rgba(224,99,90,.55);color:#ef948c}
  .chip.set.t2{border-color:rgba(226,176,74,.55);color:var(--t2)}
  .chip.set.t1{border-color:rgba(166,120,232,.55);color:#c4a3f0}
  .chip.set.t0{border-color:rgba(95,159,214,.5);color:#8fbde4}
  .chip.set.t4{border-color:rgba(78,240,138,.55);color:var(--t4)}
  button.chip{cursor:pointer;transition:opacity .12s,border-color .12s,background .12s}
  button.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .chip.stateoff{opacity:.28;border-style:dashed;background:transparent}
  .chip.ess{border-width:1.5px;font-weight:700}
  .chip.ess.off{background:rgba(207,96,84,.14)}
  .chip.ess.deff{background:rgba(95,159,214,.14)}
  .chip.ess.util{background:rgba(111,191,143,.14)}
  .chip.pick{cursor:pointer}
  .chip.pick:not(.sel){opacity:.32;border-style:dashed;background:transparent}
  .main-or{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .main-or .sep{color:var(--faint);padding:0 4px}
  .stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);vertical-align:middle}
  .stepper button{appearance:none;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:14px;
    width:24px;height:24px;cursor:pointer;line-height:1}
  .stepper button:hover{color:var(--acc)}
  .stepper button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:4px}
  .stepper .val{font-family:var(--mono);font-size:13px;color:var(--ink);min-width:16px;text-align:center}
  .rc-warn{color:var(--off);font-family:var(--mono);font-size:11px;margin-left:8px}
  .rb-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .sbtn{appearance:none;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);
    font-size:11px;padding:4px 11px;border-radius:6px;cursor:pointer;transition:all .15s}
  .sbtn:hover{color:var(--acc);border-color:var(--acc-bd)}
  .sbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .sbtn.ok{color:var(--util);border-color:rgba(111,191,143,.5)}
  .sbtn.del:hover{color:var(--off);border-color:rgba(207,96,84,.4)}
  .empty{border:1px dashed var(--border);border-radius:var(--radius);padding:38px 20px;text-align:center;color:var(--muted);margin:18px 0}
  .empty p{margin-bottom:14px;font-size:13.5px}

  /* ── Testeur ── */
  .cov-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
  .cov-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 15px}
  .cov-card .num{font-family:var(--display);font-size:23px;color:var(--acc);line-height:1.15}
  .cov-card .num.bad{color:var(--off)}
  .cov-card .lbl{color:var(--muted);font-size:11.5px;margin-top:2px}
  .covbar{display:flex;align-items:center;gap:8px}
  .covbar .track{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;min-width:60px}
  .covbar .track i{display:block;height:100%;background:linear-gradient(90deg,#3f7d55,var(--util));border-radius:3px}
  .covbar .pct{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:52px;text-align:right}
  .warn-txt{color:var(--off);font-family:var(--mono);font-size:11px}
  .ok-txt{color:var(--util);font-family:var(--mono);font-size:11px}
  .piece-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:12px}
  .piece{background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--util);border-radius:10px;overflow:hidden}
  .piece.rej{border-left-color:var(--off);opacity:.82}
  .p-head{display:flex;align-items:center;gap:7px;padding:9px 11px 6px;cursor:pointer;flex-wrap:wrap}
  .p-head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .p-slot{font-family:var(--display);font-variant:small-caps;font-size:12.5px;color:var(--faint)}
  .p-main{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink);margin-left:auto;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
  .p-subs{display:flex;gap:4px;flex-wrap:wrap;padding:0 11px 9px}
  .p-verdict{font-family:var(--mono);font-size:11px;padding:0 11px 9px}
  .p-verdict .v-ok{color:var(--util)}
  .p-verdict .v-rej{color:var(--off)}
  .p-body{display:none;border-top:1px dashed var(--border-soft);padding:9px 11px;font-size:12px;color:var(--muted)}
  .piece.open .p-body{display:block}
  .p-body .xr{margin:3px 0}
  .p-body .xr b{font-family:var(--mono);font-weight:600;color:var(--ink)}
  .slot-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--border-soft)}
  .slot-row:last-child{border-bottom:none}
  .slot-row .sl{font-family:var(--display);font-variant:small-caps;font-size:13.5px;color:var(--muted);min-width:80px}

  /* ── Panneaux, tables, référence ── */
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
  .panel.note{border-left:3px solid var(--acc);background:linear-gradient(to right,var(--acc-dim),var(--panel) 55%)}
  .panel a{color:var(--acc);text-decoration:underline dotted;text-underline-offset:2px}
  .panel a:hover{text-decoration:underline solid}
  .panel h4{font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-size:16px;font-weight:600;margin-bottom:8px}
  details.panel>summary.p-sum{cursor:pointer;font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-size:16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:9px}
  .p-sum::before{content:"›";font-family:var(--mono);color:var(--acc);transition:transform .15s;font-weight:400}
  details[open]>.p-sum::before{transform:rotate(90deg)}
  .p-sum::-webkit-details-marker{display:none}
  .p-sum:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  details.panel>summary.p-sum+*{margin-top:11px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
  th{font-family:var(--display);font-variant:small-caps;letter-spacing:.04em;font-weight:600;text-align:left;
    color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  tr:hover td{background:rgba(255,255,255,.015)}
  .tbl-wrap{overflow-x:auto}
  .tier-badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 8px;border-radius:4px}
  .tier-badge.b3{background:rgba(224,99,90,.13);color:#ef948c;border:1px solid rgba(224,99,90,.4)}
  .tier-badge.b2{background:rgba(226,176,74,.15);color:var(--t2);border:1px solid rgba(226,176,74,.4)}
  .tier-badge.b1{background:rgba(166,120,232,.13);color:#c4a3f0;border:1px solid rgba(166,120,232,.4)}
  .tier-badge.b0{background:rgba(95,159,214,.12);color:#8fbde4;border:1px solid rgba(95,159,214,.4)}
  .tier-badge.b4{background:rgba(78,240,138,.13);color:var(--t4);border:1px solid rgba(78,240,138,.4)}
  .dest{font-size:12.5px}
  .ruleref{appearance:none;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--acc);background:var(--acc-dim);
    border:1px solid var(--acc-bd);border-radius:4px;padding:1px 6px;margin:1px 4px 1px 0;white-space:nowrap;transition:all .15s}
  .ruleref.t1r{color:#8fbde4;background:rgba(95,159,214,.1);border-color:rgba(95,159,214,.3)}
  .ruleref:hover{border-color:var(--acc);text-decoration:underline}
  .ruleref.t1r:hover{border-color:var(--t1)}
  .ruleref:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .recycle{color:var(--off);font-style:italic}
  .arrow{color:var(--faint);font-family:var(--mono)}
  .transfo{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
  .transfo-row{display:grid;grid-template-columns:165px minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:6px 12px;background:var(--panel2);
    border:1px solid var(--border-soft);border-radius:8px;padding:10px 14px;font-size:13px}
  .transfo-row .cat{font-family:var(--display);font-variant:small-caps;font-size:12.5px;color:var(--faint)}
  .transfo-row .big-arrow{font-family:var(--mono);color:var(--acc);font-size:15px}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
  .stat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:13px 16px}
  .stat-card .num{font-family:var(--display);font-size:25px;color:var(--acc);line-height:1.1}
  .stat-card .lbl{color:var(--muted);font-size:11.5px;margin-top:3px}
  ul.clean{list-style:none;padding-left:0}
  ul.clean li{padding:5px 0 5px 20px;position:relative}
  ul.clean li::before{content:"◆";position:absolute;left:0;top:6px;font-size:9px;color:var(--acc)}
  details.acc{border:1px solid var(--border-soft);border-radius:9px;background:var(--panel2);margin:7px 0;overflow:hidden}
  details.acc summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
  details.acc summary::before{content:"›";font-family:var(--mono);color:var(--acc);transition:transform .15s}
  details.acc[open] summary::before{transform:rotate(90deg)}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc summary:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  details.acc .acc-body{padding:0 14px 12px 32px;color:var(--muted);font-size:13px}
  .footer-note{margin-top:34px;padding-top:14px;border-top:1px solid var(--border-soft);color:var(--faint);font-size:12px}

  /* ── Dialogue de création ── */
  .overlay{position:fixed;inset:0;background:rgba(10,8,14,.7);backdrop-filter:blur(3px);z-index:80;
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
  .overlay[hidden]{display:none}
  .dlg{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;
    width:min(860px,100%);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .dlg h3{font-family:var(--display);font-variant:small-caps;letter-spacing:.05em;font-size:19px;font-weight:600;margin-bottom:12px}
  .ap-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .ap-row label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .ap-row input[type=text]{background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--ink);padding:7px 11px;font:inherit;min-width:230px}
  .ap-grp{margin:10px 0}
  .grp-label{display:block;font-family:var(--display);font-variant:small-caps;letter-spacing:.04em;font-size:13px;color:var(--faint);margin-bottom:5px}
  .ap-actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .ap-warn{color:var(--off);font-family:var(--mono);font-size:12px}
  .ap-hint{color:var(--faint);font-size:12px;margin-top:10px}

  /* ── Toasts ── */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,90vw)}
  .toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--acc);border-radius:10px;
    padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    animation:tin .2s ease}
  @keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
  .toast button{appearance:none;background:none;border:none;color:var(--acc);font-family:var(--mono);font-size:12px;
    cursor:pointer;text-decoration:underline dotted;padding:0;flex:0 0 auto}
  .toast button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  td.td-name{font-weight:600}
  /* ── Tables empilées sur mobile ── */
  @media(max-width:680px){
    .rtable thead{display:none}
    .rtable table,.rtable tbody{display:block;width:100%}
    .rtable tr{display:block;border:1px solid var(--border-soft);border-radius:9px;background:var(--panel2);padding:10px 12px;margin:10px 0}
    .rtable tr:hover td{background:none}
    .rtable td{display:block;border:none;padding:4px 0}
    .rtable td::before{content:attr(data-th);display:block;font-family:var(--display);font-variant:small-caps;letter-spacing:.04em;font-size:11.5px;color:var(--faint)}
    /* le nom (set ou règle) devient le titre de la carte : plus gros, sans label redondant */
    .rtable td.td-name{font-family:var(--display);font-variant:small-caps;letter-spacing:.03em;font-size:16.5px;padding:0 0 4px;border-bottom:1px dashed var(--border-soft);margin-bottom:4px}
    .rtable td.td-name::before{display:none}
    /* table de couverture : les 3 chiffres tiennent sur une seule ligne */
    .rtable td.td-mid{display:inline-block;width:33%;padding:4px 6px 4px 0;vertical-align:top}
    .panel{padding:14px}
    .transfo-row{grid-template-columns:1fr}
    .transfo-row .big-arrow{justify-self:start}
    .strip{grid-template-columns:1fr 1fr;gap:8px}
    .stat-card{padding:10px 12px}
    .stat-card .num{font-size:20px}
  }

  /* ── Impression ── */
  #print-view{display:none}
  @media print{
    .app,#toasts,.overlay{display:none!important}
    body{background:#fff!important}
    #print-view{display:block;color:#111;font-family:Georgia,"Times New Roman",serif;font-size:11pt;line-height:1.45}
    #print-view h1{font-size:16pt;font-variant:small-caps;letter-spacing:.04em;margin:0 0 2pt;font-weight:600}
    #print-view .pv-meta{font-size:9pt;color:#555;margin-bottom:12pt}
    #print-view h2{font-size:12.5pt;font-variant:small-caps;letter-spacing:.03em;border-bottom:1pt solid #999;
      margin:14pt 0 8pt;padding-bottom:2pt;break-after:avoid;font-weight:600}
    #print-view .pv-rule{break-inside:avoid;border-left:2.5pt solid #b58a2e;padding:3pt 0 3pt 10pt;margin:0 0 9pt}
    #print-view .pv-rule.t1{border-left-color:#4a7fae}
    #print-view .pv-title{font-weight:bold;font-size:11.5pt}
    #print-view .pv-mod{font-size:8pt;color:#8a6d1f;font-weight:normal;margin-left:8pt;text-transform:uppercase;letter-spacing:.07em}
    #print-view .pv-line{margin:1.5pt 0}
    #print-view .pv-k{color:#555;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em}
    #print-view .pv-warn{color:#a33;font-size:9.5pt;font-weight:normal}
    #print-view .pv-foot{margin-top:14pt;padding-top:6pt;border-top:1pt solid #999;font-size:9pt;color:#444}
    @page{margin:14mm}
  }

  /* ── Responsive : tiroir latéral mobile ── */
  .burger{display:none}
  .scrim{display:none}
  @media(max-width:920px){
    /* minmax(0,1fr) : sans le 0, l'item de grille garde min-width:auto et gonfle à la largeur
       de son contenu (rangée d'onglets…) → scroll latéral de toute la page */
    .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh}
    .burger{display:flex;align-items:center;justify-content:center;position:fixed;top:10px;left:10px;z-index:70;
      width:42px;height:42px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--acc);
      font-size:19px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
    .burger:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
    aside.side{position:fixed;top:0;left:0;bottom:0;height:100dvh;width:min(80vw,300px);z-index:60;
      transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.45);overflow-y:auto}
    body.nav-open aside.side{transform:none}
    body.nav-open .burger{display:none}
    input,select,textarea{font-size:16px}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,6,12,.55);backdrop-filter:blur(2px);z-index:56}
    main#view{padding:64px 14px 70px;overflow:visible}
    .row-body{padding-left:16px}
    .row-mains{display:none}
    .minis{display:none}
    .role{display:none}
  }
  body.light .burger{box-shadow:0 4px 14px rgba(60,50,30,.2)}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="diamond">◆</span>
      <div><h1 data-i18n="app_title">Tri d'équipement</h1><div class="sub">Watcher of Realms</div></div>
    </div>
    <nav class="mainnav" id="mainnav">
      <button class="nav-btn" data-nav="regles">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="6" cy="4" r="1.7" fill="var(--bg-side)"/><circle cx="11" cy="8" r="1.7" fill="var(--bg-side)"/><circle cx="5" cy="12" r="1.7" fill="var(--bg-side)"/></svg>
        <span data-i18n="nav_rules">Règles</span> <span class="count" id="nav-count-rules">0</span></button>
      <button class="nav-btn" data-nav="testeur">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h4M7 2v4.5L3.5 12a1.6 1.6 0 0 0 1.4 2.5h6.2a1.6 1.6 0 0 0 1.4-2.5L9 6.5V2"/><path d="M5 10.5h6"/></svg>
        <span data-i18n="nav_tester">Testeur</span></button>
      <button class="nav-btn" data-nav="sets">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        <span data-i18n="nav_sets">Sets &amp; transfo</span> <span class="count">48</span></button>
      <button class="nav-btn" data-nav="reference">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2.5h7a3 3 0 0 1 3 3V14H6a3 3 0 0 1-3-3V2.5Z"/><path d="M6 5.5h4M6 8h4"/></svg>
        <span data-i18n="nav_ref">Référence</span></button>
    </nav>
    <div class="side-foot">
      <div class="prog-wrap">
        <div class="prog-label"><span data-i18n="prog">Saisie en jeu</span><b id="prog-num">0/0</b></div>
        <div class="prog-bar"><i id="prog-fill" style="width:0%"></i></div>
      </div>
      <button class="side-btn" id="import-btn" data-i18n="import_btn">Importer des règles (JSON)</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="side-btn" id="theme-btn" title="basculer le thème">☀ Mode clair</button>
      <button class="side-btn" id="density-btn" title="densité de l'affichage">Densité : confort</button>
      <div class="acc-row"><span class="ctl-label" data-i18n="lang">Langue</span>
        <div class="seg seg-lang" id="lang-seg">
          <button type="button" data-lang="fr">Français</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <div class="acc-row"><span class="ctl-label" data-i18n="accent">Accent</span>
        <span class="acc-dots">
          <button type="button" class="acc-dot on" data-acc="or" style="background:#e2b04a" title="or" aria-label="accent or"></button>

function applyLang(){
  try{ document.title = t("doc_title"); }catch(_){}
  if(document.documentElement && document.documentElement.setAttribute)
    document.documentElement.setAttribute("lang", LANG);
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title = t(el.dataset.i18nTitle); });

function activeTab(){ return TABS.find(t=>t.id===activeTabId) || TABS[0] || null; }
function allRules(){ return TABS.flatMap(t=>t.rules); }
// Les ids de règles sont uniques PAR onglet (G1, D1… repartent à 1 dans chaque onglet) :
// les recherches privilégient l'onglet actif, d'où viennent tous les éléments rendus.
function getRule(id){ const t = activeTab(); return (t && t.rules.find(r=>r.id===id)) || allRules().find(r=>r.id===id) || null; }
function tabOfRule(id){ const t = activeTab(); if(t && t.rules.some(r=>r.id===id)) return t; return TABS.find(x=>x.rules.some(r=>r.id===id)) || null; }
function nextRuleId(tab, section){
  const p = section==="left" ? "G" : "D";
  const max = tab.rules.reduce((m,r)=>{ const x = new RegExp("^"+p+"(\\d+)$").exec(r.id); return x ? Math.max(m, +x[1]) : m; }, 0);

  return p+(max+1);
}
function entKey(tabId, rid){ return tabId+":"+rid; }
function isEntered(rid){ return ENTERED.has(entKey(activeTabId, rid)); }
function sortStats(arr){ return ALLSTATS.filter(x=>arr.includes(x)); }
const tierLabel = t => t===4 ? "∞" : t;
function sortSets(arr){ return [...arr].sort((a,b)=>(SET_ORDER[a]??1e9)-(SET_ORDER[b]??1e9)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function newTab(name){ const nt = {id:"T"+(tabSeq++), name:name||t("tab_new", tabSeq), key:"", rules:[]}; TABS.push(nt); return nt; }
function ensureTab(){ if(!TABS.length) newTab(t("tab_default")); if(!activeTab()) activeTabId = TABS[0].id; }
function bumpSeqs(){
  for(const t of TABS){ const m = /^T(\d+)$/.exec(t.id); if(m) tabSeq = Math.max(tabSeq, +m[1]+1); }
}
function registerArchs(){
  for(const r of allRules()) for(const a of (r.arch||[]))
    if(!ARCHS.includes(a) && !EXTRA_ARCHS.includes(a)) EXTRA_ARCHS.push(a);
}
function legalMainsForSide(side){
  const u = new Set();
  SLOTS.filter(s=>s.side===side).forEach(s=>CONSTRAINTS[s.key].forEach(a=>u.add(a)));
  return sortStats([...u]);

function payload(){ return JSON.stringify({v:4, consV:CONS_V, tabs:TABS, active:activeTabId, entered:[...ENTERED], constraints:CONSTRAINTS, theme, acc:ACC, dens:DENSITY, lang:LANG_CHOSEN?LANG:null, xarch:EXTRA_ARCHS, tabSeq}); }
function getStore(){
  try{
    if(window.storage && window.storage.get && window.storage.set){
      return { tag:"cloud",
        get: async k => { const r = await window.storage.get(k); return (r && r.value != null) ? r.value : null; },
        set: async (k,v) => { await window.storage.set(k, v); } };
    }
  }catch(_){}
  try{
    const t = "__wor_probe__";
    localStorage.setItem(t,"1"); localStorage.removeItem(t);
    return { tag:"local",
      get: async k => localStorage.getItem(k),
      set: async (k,v) => { localStorage.setItem(k, v); } };
  }catch(_){}

}
async function persist(){
  const store = getStore();
  if(!store){ setSave(t("save_session"),"warn"); return; }
  try{ await store.set(KEY, payload()); setSave(store.tag==="local" ? t("save_local") : t("save_cloud"),"ok"); }
  catch(e){ setSave(t("save_session"),"warn"); }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600); }
function sanitizeRule(r){
  if(!r || typeof r.id!=="string") return null;
  const mains = Array.isArray(r.mains)?r.mains.map(fixStat).filter(x=>ALLSTATS.includes(x)):[];
  const pool = Array.isArray(r.pool)?sortStats(r.pool.map(fixStat).filter(x=>ALLSTATS.includes(x))):[];
  const sets = Array.isArray(r.sets)?r.sets.map(fixSet).filter(x=>SETTIER[x]!==undefined):[];
  let section = r.section;
  if(section!=="right" && section!=="left"){ section = SETSIDE[sets[0]] || "right"; } // migration des anciennes sections "t1"
  return {
    id:r.id, name:String(r.name||r.id).slice(0,60),
    section,
    sets,
    mains:sortStats(mains),
    arch:Array.isArray(r.arch)?[...new Set(r.arch.filter(x=>typeof x==="string").map(x=>x.trim().slice(0,20)).filter(Boolean))]:[],
    pool,
    ess:Array.isArray(r.ess)?sortStats(r.ess.map(fixStat).filter(x=>pool.includes(x))):[],
    req:Number.isInteger(r.req)?Math.min(4,Math.max(1,r.req)):1
  };
}
// Renumérote chaque onglet : G1..Gn / D1..Dn dans l'ordre des règles (couvre les vieux ids R/P
// et les compteurs qui avaient dérivé entre onglets). Les flags « saisie en jeu » sont relevés
// AVANT renommage puis reposés — les clés ENTERED sont scellées par onglet (tabId:ruleId).
// La numérotation suit donc la position : un réordonnancement se retrouve dans les ids au
// prochain chargement (UI.open est purement runtime).
function migrateRuleIds(){
  for(const tab of TABS){
    const flags = tab.rules.map(r=>ENTERED.has(entKey(tab.id, r.id)));
    for(const k of [...ENTERED]) if(k.startsWith(tab.id+":")) ENTERED.delete(k);
    const counters = {G:0, D:0};
    tab.rules.forEach((r,i)=>{
      const p = r.section==="left" ? "G" : "D";
      r.id = p+(++counters[p]);
      if(flags[i]) ENTERED.add(entKey(tab.id, r.id));
    });
  }
}
async function restoreState(){
  const store = getStore();
  if(!store){ setSave(t("save_session"),"warn"); ensureTab(); renderView(); return; }
  try{
    const raw = await store.get(KEY);
    if(!raw){ setSave(store.tag==="local" ? t("save_ready_local") : t("save_ready"),"ok"); ensureTab(); renderView(); return; }
    const data = JSON.parse(raw);
    if(data && data.v===4){
      if(Array.isArray(data.tabs)){
        TABS = data.tabs.map(t=>({
          id:typeof t.id==="string"?t.id:("T"+(tabSeq++)),
          name:String(t.name||"Onglet").slice(0,40),
          key:typeof t.key==="string"?t.key.slice(0,60):"",
          rules:Array.isArray(t.rules)?t.rules.map(sanitizeRule).filter(Boolean):[]
        }));
      }
      if(typeof data.active==="string") activeTabId = data.active;
      if(Array.isArray(data.entered)) data.entered.forEach(id=>{
        if(typeof id!=="string") return;
        if(id.includes(":")){ ENTERED.add(id); return; }
        // ancien format non scopé : les ids étaient uniques app-wide, on retrouve l'onglet porteur
        const tb = TABS.find(x=>x.rules.some(r=>r.id===id));
        if(tb) ENTERED.add(entKey(tb.id, id));
      });
      if(data.consV===CONS_V && data.constraints && typeof data.constraints==="object"){
        for(const s of SLOTS){
          if(Array.isArray(data.constraints[s.key]))
            CONSTRAINTS[s.key] = sortStats(data.constraints[s.key].map(fixStat).filter(x=>ALLSTATS.includes(x)));
        }
      } // sinon : les listes de mains ont été corrigées depuis — on repart des défauts à jour
      if(Number.isInteger(data.tabSeq)) tabSeq = Math.max(tabSeq, data.tabSeq);
      if(data.theme==="light" || data.theme==="dark") theme = data.theme;
      if(ACCENTS.includes(data.acc)) ACC = data.acc;
      if(data.dens==="compact" || data.dens==="confort") DENSITY = data.dens;
      if(data.lang==="fr" || data.lang==="en"){ LANG = data.lang; LANG_CHOSEN = true; }
      if(Array.isArray(data.xarch)) EXTRA_ARCHS = [...new Set(data.xarch.filter(x=>typeof x==="string").map(x=>x.trim().slice(0,20)).filter(x=>x && !ARCHS.includes(x)))];
    } else if(data){
      const rules = (data.v>=2) ? (data.rules||{}) : (data||{});
      const customs = (data.v>=2 && Array.isArray(data.custom)) ? data.custom : [];
      const mt = newTab(t("tab_default"));
      for(const c of customs){
        const st = rules[c.id] || {};
        const rule = sanitizeRule({...c, pool:st.pool||[], ess:st.ess||[], req:st.req||3});
        if(rule) mt.rules.push(rule);
      }
      if(Array.isArray(data.entered)) data.entered.forEach(id=>{ if(mt.rules.some(r=>r.id===id)) ENTERED.add(entKey(mt.id, id)); });
      activeTabId = mt.id;
    }
    migrateRuleIds();
    ensureTab(); bumpSeqs(); registerArchs();
    setSave(t("save_restored"),"ok");
  }catch(e){ setSave(t("save_session"),"warn"); ensureTab(); }
  applyTheme();
  applyLang();
  renderView();
}

/* ══════════════ MOTEUR DE MATCHING ══════════════ */
function matchSubs(rule, subs, main){
  // Sémantique du builder officiel : mains en OU ; le main effectif de la pièce
  // est ignoré des critères de subs (★ comme comptage) — une pièce ne portant
  // jamais sa stat de main en sub, la règle peut chevaucher mains et pool.
  // Ensuite : chaque ★ restant doit apparaître (ET strict) ; le requis se
  // compte sur la liste sélectionnée, ★ incluses.
  for(const e of rule.ess){ if(e===main) continue; if(!subs.includes(e)) return false; }
  let k = 0;
  for(const x of subs) if(x!==main && rule.pool.includes(x)) k++;
  return k >= rule.req;
}
function matchRule(rule, piece){
  if(!rule.sets.includes(piece.set)) return false;
  if(rule.mains.length && !rule.mains.includes(piece.main)) return false;
  return matchSubs(rule, piece.subs, piece.main);
}
function explainPiece(piece){
  const tab = activeTab();
  const out = { matched:[], near:[], off:0 };
  for(const r of (tab?tab.rules:[])){
    if(!r.sets.includes(piece.set)){ out.off++; continue; }
    if(r.mains.length && !r.mains.includes(piece.main)){
      out.near.push({r, why:t("why_main", piece.main, r.mains.join(" / "))}); continue;
    }
    const effEss = r.ess.filter(e=>e!==piece.main);
    const miss = effEss.filter(e=>!piece.subs.includes(e));
    if(miss.length){ out.near.push({r, why:t("why_ess", miss.join(", "))}); continue; }
    const effPool = r.pool.filter(x=>x!==piece.main);
    const k = piece.subs.filter(x=>effPool.includes(x)).length;
    if(k < r.req){ out.near.push({r, why:t("why_count", k, r.req)}); continue; }
    out.matched.push(r);
  }
  return out;
}
function matchedNames(ids){ return ids.map(id=>{ const r=getRule(id); return r?r.name:id; }); }

/* ══════════════ ÉNUMÉRATION (couverture) ══════════════ */
const comboCache = new Map();
function subCombos(main){
  if(comboCache.has(main)) return comboCache.get(main);
  const pool = ALLSTATS.filter(a=>a!==main);
  const out = [];
  for(let a=0;a<pool.length;a++) for(let b=a+1;b<pool.length;b++)
    for(let c=b+1;c<pool.length;c++) for(let d=c+1;d<pool.length;d++)
      out.push([pool[a],pool[b],pool[c],pool[d]]);
  comboCache.set(main, out);
  return out;
}
function computeCoverage(){
  const tab = activeTab();
  const rules = tab ? tab.rules : [];
  let total=0, kept=0, multi=0;
  const perRule = {}, uniq = {};
  rules.forEach(r=>{ perRule[r.id]=0; uniq[r.id]=0; });
  const perSet = {};
  SETS.forEach(s=>{ perSet[s.n]={total:0,kept:0}; });
  for(const slot of SLOTS){
    const mains = CONSTRAINTS[slot.key];
    const sideSets = SETS.filter(s=>s.side===slot.side);
    for(const main of mains){
      const combos = subCombos(main);
      for(const set of sideSets){
        const rel = rules.filter(r=>r.sets.includes(set.n) && (!r.mains.length || r.mains.includes(main)));
        perSet[set.n].total += combos.length;
        total += combos.length;
        if(!rel.length) continue;
        for(const subs of combos){
          let m=0, first=null;
          for(const r of rel){ if(matchSubs(r, subs, main)){ m++; perRule[r.id]++; if(!first) first=r.id; } }
          if(m){ kept++; perSet[set.n].kept++; if(m>1) multi++; else uniq[first]++; }
        }
      }
    }
  }
  return {total, kept, multi, perRule, uniq, perSet, rules};
}

/* ══════════════ GÉNÉRATION ALÉATOIRE ══════════════ */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function setAvailableFor(name, src, lvl){
  const av = SET_AVAIL[name] || {};
  const inR = (r, l) => !!r && (l==="all" || (l>=r.min && l<=r.max));
  if(src==="gd") return inR(av.gd, lvl);
  if(src==="gr1"||src==="gr2"||src==="gr3") return !!av.gr && av.gr.n===+src.slice(2) && inR(av.gr, lvl);

  return lvl==="all" || inR(av.gr, lvl) || inR(av.gd, lvl); // src "all" : dispo quelque part à ce niveau
}
function scopeSets(){
  // Deux scopes exclusifs : par tiers/ensemble, OU par source de farm (raid/donjon + niveau).
  if(UI.test.scopeMode==="source") return SETS.filter(s=>setAvailableFor(s.n, UI.test.src, UI.test.lvl)).map(s=>s.n);

  return SETS.filter(s=>UI.test.tiers.has(String(s.t)) && UI.test.sides.has(s.side)).map(s=>s.n);
}
function randPiece(sets, opts={}){
  for(let guard=0; guard<50; guard++){
    let set;
    if(opts.rates){
      // Tirage du tier selon les taux mesurés (renormalisés sur les tiers présents), puis set uniforme dans le tier.
      const byTier = {};
      for(const n of sets){ const t = SETTIER[n]; (byTier[t] = byTier[t] || []).push(n); }
      const tiers = Object.keys(byTier).map(Number).filter(t=>opts.rates[t]);
      const total = tiers.reduce((s,t)=>s+opts.rates[t], 0);
      if(tiers.length && total>0){
        let r = Math.random()*total, tier = tiers[tiers.length-1];
        for(const t of tiers){ r -= opts.rates[t]; if(r<=0){ tier = t; break; } }
        set = pick(byTier[tier]);
      } else set = pick(sets);
    } else set = pick(sets);
    const side = SETSIDE[set];
    const slots = SLOTS.filter(s=>s.side===side && CONSTRAINTS[s.key].length);
    if(!slots.length) continue;
    const slot = pick(slots);
    const main = pick(CONSTRAINTS[slot.key]);
    let rest = ALLSTATS.filter(a=>a!==main);
    // Sub RR sur arme/torse : réservée aux pièces anciennes (~0,87 % des drops de raid) — simulée en mode raids.
    if(opts.ancientRate!=null && (slot.key==="arme" || slot.key==="torse") && Math.random()>=opts.ancientRate){
      rest = rest.filter(a=>a!=="RR");
    }
    const subs = [];
    while(subs.length<4){ const s = pick(rest); if(!subs.includes(s)) subs.push(s); }
    return {slot:slot.key, set, main, subs:sortStats(subs)};
  }
  return null;
}
function refreshSampleVerdicts(){
  const tab = activeTab();
  UI.test.sample.forEach(p=>{ p.matched = tab ? tab.rules.filter(r=>matchRule(r,p)).map(r=>r.id) : []; });
}
function generateSample(){
  const sets = scopeSets();
  UI.test.sample = [];
  UI.test.openPieces = new Set();
  if(!sets.length) return;
  // Pondération et pièces anciennes : Gear Raids uniquement. Si du T0 est dans le scope
  // (bas niveaux), aucune donnée mesurée → tirage uniforme comme pour les donjons.
  const isRaid = UI.test.scopeMode==="source" && UI.test.src!=="gd";
  const rates = (isRaid && sets.every(n=>SETTIER[n]!==0)) ? RAID_TIER_RATES[UI.test.src] : null;
  const opts = { rates, ancientRate: isRaid ? ANCIENT_RATE : null };
  for(let i=0;i<UI.test.n;i++){
    const p = randPiece(sets, opts);
    if(!p) break;
    p.matched = activeTab() ? activeTab().rules.filter(r=>matchRule(r,p)).map(r=>r.id) : [];
    UI.test.sample.push(p);
  }
}

function matchFilters(r){
  if(UI.fSection!=="all" && r.section!==UI.fSection) return false;
  if(UI.fArch!=="all" && !(r.arch||[]).includes(UI.fArch)) return false;
  if(UI.fSet!=="all" && !r.sets.includes(UI.fSet)) return false;
  if(UI.fTier!=="all" && !r.sets.some(s=>SETTIER[s]===+UI.fTier)) return false;
  for(const a of UI.fMain) if(!r.mains.includes(a)) return false;
  for(const a of UI.fSubs) if(!r.pool.includes(a)) return false;
  if(UI.q){
    const q = UI.q.toLowerCase();
    const hay = (r.id+" "+r.name+" "+r.sets.join(" ")+" "+r.sets.map(n=>SET_FR[n]||"").join(" ")+" "+r.mains.join(" ")+" "+(r.arch||[]).map(archLabel).join(" ")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function manualPanel(){
  const m = UI.test.manual;
  const slot = SLOTS.find(s=>s.key===m.slot);
  const legalMains = CONSTRAINTS[m.slot];
  const sideSets = SETS.filter(s=>s.side===slot.side);
  if(!sideSets.some(s=>s.n===m.set)) m.set = sideSets[0].n;
  if(!legalMains.includes(m.main)) m.main = legalMains[0]||"";
  m.subs = m.subs.filter(s=>s!==m.main).slice(0,4);
  const subChips = ALLSTATS.filter(a=>a!==m.main).map(a=>
    `<button type="button" class="chip ${STAT[a]} pick${m.subs.includes(a)?' sel':''}" data-msub="${a}">${a}</button>`).join("");
  let verdict = "";
  if(m.subs.length<4){
    verdict = `<p class="hint">${t("m_pick", m.subs.length)}</p>`;
  } else {
    const piece = {slot:m.slot, set:m.set, main:m.main, subs:sortStats(m.subs)};
    const ex = explainPiece(piece);
    const kept = ex.matched.length>0;
    verdict = `<div class="panel" style="border-left:3px solid ${kept?"var(--util)":"var(--off)"}">
      <h4>${kept?t("m_kept", ex.matched.map(r=>esc(r.name)).join(", ")):t("v_rej")}</h4>
      ${ex.near.map(x=>`<div class="xr" style="font-size:13px;color:var(--muted)"><b style="font-family:var(--mono);color:var(--ink)">${x.r.id}</b> — ${esc(x.why)}</div>`).join("")}
      ${ex.off?`<div class="xr" style="color:var(--faint);font-size:12px">${t("xr_off", ex.off)}</div>`:""}
    </div>`;
  }
  return `
    <div class="panel">
      <div class="ap-row" style="margin-bottom:6px">
        <label>${t("m_slot")} <select id="tm-slot">${SLOTS.map(s=>`<option value="${s.key}"${s.key===m.slot?" selected":""}>${slotLabel(s.key)}</option>`).join("")}</select></label>
        <label>${t("m_set")} <select id="tm-set">${sideSets.map(s=>`<option value="${esc(s.n)}"${s.n===m.set?" selected":""}>T${tierLabel(s.t)} · ${esc(setName(s.n))}</option>`).join("")}</select></label>
        <label>${t("m_main")} <select id="tm-main">${legalMains.map(a=>`<option value="${a}"${a===m.main?" selected":""}>${a}</option>`).join("")}</select></label>
      </div>
      <span class="grp-label">${t("m_subs")}</span>
      <div>${subChips}</div>
    </div>
    ${verdict}`;
}
function constraintsInner(){

      <div class="tbl-wrap rtable"><table>

      </table></div>
      <div class="panel note" style="margin:12px 0 0">

        <b>AS excédentaire</b> (marge pour plus tard) &gt; <b>HP%</b> &gt; <b>RR</b>. Le DEF% ne vaut rien en sub DPS — exclu de tous les pools offensifs.
      </div>
    </details>

    <details class="panel">
      <summary class="p-sum">La doctrine</summary>
      <ul class="clean">
        <li><b>Le main = la stat de scaling.</b> ATK% pour les ATK-scalers, HP% pour les HP-scalers (Gluttony…), DEF% pour les DEF-scalers (Ghan, Trusk, Azhor). Même règle, même trio de subs.</li>

        <li><b>Heals : leur stat de scaling + AS en priorité.</b> Main = stat de scaling (ATK% ou HP%) ; en subs, priorité à la stat de scaling et à l'AS (plus de casts = plus de soins), HE ensuite. Les heals HP n'ont pas besoin d'ATK.</li>
        <li><b>Supports : RR + survie.</b> HP% toujours meilleur que DEF%, et DEF% meilleur que les flats — le flat HP sort des pools au profit du DEF%.</li>

      </ul>
    </details>

    <details class="panel">
      <summary class="p-sum">Politique par tier</summary>
      <div class="tbl-wrap rtable"><table>

        <tbody>
          <tr><td data-th="Tier"><span class="tier-badge b4">T∞</span></td><td data-th="Rôle">Nouveau palier — donjons d'équipement 1-3 &amp; raids d'équipement</td><td data-th="Sévérité">À définir — construis les règles au fil des premiers drops</td></tr>
          <tr><td data-th="Tier"><span class="tier-badge b3">T3</span></td><td data-th="Rôle">Forge (choisies) — et en drop aléatoire dans les donjons d'équipement</td><td data-th="Sévérité">Filet de sécurité, req 2-3</td></tr>
          <tr><td data-th="Tier"><span class="tier-badge b2">T2</span></td><td data-th="Rôle">Le farm réel du palier (GR 19-24)</td><td data-th="Sévérité">Trio requis, req 2-3 — en transition, tolérer le triple subs sur heals/tanks</td></tr>
          <tr><td data-th="Tier"><span class="tier-badge b1">T1</span></td><td data-th="Rôle">Porté en early, remplacé au fil de la progression — en late, ne sert plus qu'à être <b>transformé</b> en T2/T3 (essences / gemmes)</td><td data-th="Sévérité">Early : règles souples si besoin d'équiper · late : <b>quad parfait</b> pour la transformation (req 4)</td></tr>
          <tr><td data-th="Tier"><span class="tier-badge b0">T0</span></td><td data-th="Rôle">—</td><td data-th="Sévérité">Aucune règle → recyclage intégral</td></tr>
        </tbody>
      </table></div>
    </details>

    <details class="panel">
      <summary class="p-sum">Mécanique de l'outil in-game &amp; pièges</summary>
      <ul class="clean">
        <li><b>Mains en OU — le main de la pièce est neutralisé côté subs.</b> Confirmé dans le builder officiel : une règle peut porter la même stat en main et en sub ; sur chaque pièce, le main effectif est simplement ignoré des critères de subs (★ comme comptage). Fusionner des mains reste délicat quand les ★ dépendent du main — dans ce cas, une règle par main reste plus sûre.</li>
        <li><b>ATK / HP en main = sélecteur de slot gauche.</b> Arme = toujours ATK, torse = toujours HP. C'est le seul moyen de cibler un slot, l'outil n'ayant pas de champ dédié. Côté droit, les exclusivités CC/AS/RR jouent le même rôle : bracelet / collier / bague.</li>
        <li><b>Sémantique du matching confirmée : ★ = ET, liste = comptage.</b> Chaque sub marqué ★ doit apparaître sur la pièce, sans exception. Le nombre requis se compte ensuite sur toute la liste sélectionnée, ★ incluses : 3 ★ et requis 4 → les 3 ★ plus au moins un autre sub de la liste ; 3 ★ et requis 3 → les ★ suffisent, la 4ᵉ position est totalement libre.</li>
        <li><b>Une pièce ne porte jamais sa stat de main en sub</b> (physique du jeu) : l'outil retire donc le main de la pièce des critères avant d'évaluer ★ et comptage — exactement comme le builder officiel.</li>
        <li><b>Pas de détection variant / exclusive / tier / enhancement.</b> Et c'est assumé : une pièce Unrivalled Power ou Exclusive aux stats pourries doit dégager comme les autres.</li>
      </ul>
    </details>

    <details class="panel">
      <summary class="p-sum">Points ouverts</summary>
      <details class="acc"><summary>Cumul des règles : OR ou priorité ?</summary><div class="acc-body">Le système suppose un OR de conservation : une pièce est gardée dès qu'elle matche au moins une règle. Si l'outil évalue en priorité descendante avec arrêt au premier match, l'ordre de saisie compte — dans ce cas, saisir les règles les plus strictes en premier. Le glisser-déposer des cartes réordonne exactement cet ordre.</div></details>
      <details class="acc"><summary>Héros AS-immunes</summary><div class="acc-body">Vierna, Zelus, Osiren, Dolores (et Xaris hors invocations) n'exploitent pas l'AS. Si une règle exige AS en essentiel, leurs pièces idéales (CC + CD sans AS) sont recyclées : assumé, ou prévoir une règle dédiée sans AS.</div></details>
      <details class="acc"><summary>Sets de présence (Morale)</summary><div class="acc-body">Le porteur importe peu, seul le bonus compte. Si les règles sur ces sets sont trop strictes pour équiper trois pièces sur un porteur sacrifiable, baisser leur requis à 2 — ou l'équiper avec les rebuts.</div></details>
      <details class="acc"><summary>Whirlwind (+75 AS)</summary><div class="acc-body">Un quad Whirlwind a deux débouchés — porté tel quel pour boucler un budget 450 difficile, ou transformé en Warlord / Wicked Vengeance. Décision au moment de dépenser la ressource, pas au tri.</div></details>
      <details class="acc"><summary>Plafond de règles in-game</summary><div class="acc-body">Si l'outil plafonne, sacrifier d'abord les règles aux captures les plus faibles ou sans capture exclusive — le mode Couverture du Testeur les identifie directement.</div></details>
      <details class="acc"><summary>Rage Regen Efficiency</summary><div class="acc-body">Un seul RR dans la liste d'attributs. Si une distinction RR / RR Efficiency apparaît dans l'outil, toutes les règles utilisant RR sont à revisiter.</div></details>
    </details>

    <details class="panel">
      <summary class="p-sum">Liens utiles</summary>
      <ul class="clean">
        <li><a href="https://watcher-of-realms.fandom.com/wiki/Attribute" target="_blank" rel="noopener">Wiki — Attributes</a> : la référence des stats et de leurs plages de rolls.</li>
        <li><a href="https://watcher-of-realms.fandom.com/wiki/Gear" target="_blank" rel="noopener">Wiki — Gear</a> : la page des sets d'équipement.</li>
        <li><a href="https://github.com/Mawldor/WoR-content/tree/main" target="_blank" rel="noopener">WoR-content (Mawldor)</a> : tests en réel de quelles stats choisir, et d'autres guides très utiles.</li>
        <li><a href="https://github.com/Mawldor/WoR-content/blob/main/HE-ATK.md" target="_blank" rel="noopener">HE vs ATK (Mawldor)</a> : le test des heals — arbitrer Effet de soin contre ATK.</li>
      </ul>
    </details>
  </div>`;
}

      <div class="tbl-wrap rtable"><table>

      </div>

    <details class="panel">
      <summary class="p-sum">The doctrine</summary>
      <ul class="clean">
        <li><b>The main = the scaling stat.</b> ATK% for ATK-scalers, HP% for HP-scalers (Gluttony…), DEF% for DEF-scalers (Ghan, Trusk, Azhor). Same rule, same sub trio.</li>
        <li><b>Mandatory offensive trio in DPS subs: CC + CD + AS.</b> No non-offensive stat as required on a DPS rule. The 4th slot is free — that's where HP%/RR land naturally.</li>
        <li><b>ATK% beats CD.</b> ATK is subtracted from the target's DEF/M.RES <i>before</i> crit damage applies; the higher enemy DEF climbs, the wider the gap. Exception: in very late game, with enough armor penetration and def break on the target, residual DEF collapses — and Crit.DMG takes the lead back.</li>
        <li><b>Transition to late game: triple T2 stays playable.</b> While waiting for quads, T2 pieces with 3 good subs gear heals and tanks very well — and some heroes mostly want maximal RR with the matching set. Hence a less strict "transition" tab (required 3) next to the strict rule set.</li>
        <li><b>AS or CD as main: perfect quad or nothing.</b> One or two heroes for AS (amulet only), a single one for CD. The piece carries the four other offensive subs, no exception.</li>
        <li><b>Inspire: maximize ATK, ATK%, HP%, AS.</b> Three pure heroes (ATK + survival); hybrids (ATK-based heal, crowd control) take AS on top.</li>
        <li><b>Heals: their scaling stat + AS first.</b> Main = scaling stat (ATK% or HP%); in subs, priority to the scaling stat and AS (more casts = more healing), HE next. HP-based heals don't need ATK.</li>
        <li><b>Supports: RR + survival.</b> HP% always beats DEF%, and DEF% beats flats — flat HP leaves the pools in favor of DEF%.</li>
        <li><b>Tanks: HP% as main, RR essential</b> — monetized via Rage Regen (Attacked), no AS needed. DEF% valid as a sub (Tempered Will synergy).</li>
      </ul>
    </details>

    <details class="panel">
      <summary class="p-sum">Per-tier policy</summary>
      <div class="tbl-wrap rtable"><table>
        <thead><tr><th>Tier</th><th>Role</th><th>Advised strictness</th></tr></thead>
        <tbody>

          <tr><td data-th="Tier"><span class="tier-badge b1">T1</span></td><td data-th="Role">Worn in early game, replaced as you progress — in late game it only serves to be <b>transformed</b> into T2/T3 (essences / gems)</td><td data-th="Strictness">Early: loose rules if you need to gear up · late: <b>perfect quad</b> for transformation (req 4)</td></tr>
          <tr><td data-th="Tier"><span class="tier-badge b0">T0</span></td><td data-th="Role">—</td><td data-th="Strictness">No rule → full recycling</td></tr>
        </tbody>
      </table></div>
    </details>

    <details class="panel">
      <summary class="p-sum">In-game tool mechanics &amp; traps</summary>
      <ul class="clean">
        <li><b>Mains in OR — the piece's main is neutralized on the sub side.</b> Confirmed in the official builder: a rule can carry the same stat as main and sub; on each piece, the effective main is simply ignored by the sub criteria (★ and counting alike). Merging mains stays tricky when the ★ depend on the main — in that case, one rule per main remains safer.</li>
        <li><b>ATK / HP as main = left-slot selector.</b> Weapon = always ATK, armor = always HP. It's the only way to target a slot, the tool having no dedicated field. On the right side, the CC/AS/RR exclusivities play the same role: bangle / amulet / ring.</li>
        <li><b>Confirmed matching semantics: ★ = AND, list = counting.</b> Every ★-marked sub must appear on the piece, no exception. The required count then runs over the whole selected list, ★ included: 3 ★ and required 4 → the 3 ★ plus at least one other sub from the list; 3 ★ and required 3 → the ★ suffice, the 4th position is completely free.</li>
        <li><b>A piece never carries its main stat as a sub</b> (game physics): the tool therefore removes the piece's main from the criteria before evaluating ★ and counting — exactly like the official builder.</li>
        <li><b>No variant / exclusive / tier / enhancement detection.</b> And that's deliberate: an Unrivalled Power or Exclusive piece with rotten stats must go like any other.</li>
      </ul>
    </details>

    <details class="panel">
      <summary class="p-sum">Open questions</summary>
      <details class="acc"><summary>Rule stacking: OR or priority?</summary><div class="acc-body">The system assumes a keep-OR: a piece is kept as soon as it matches at least one rule. If the tool evaluates in descending priority stopping at the first match, entry order matters — in that case, enter the strictest rules first. Dragging the cards reorders exactly that order.</div></details>
      <details class="acc"><summary>AS-immune heroes</summary><div class="acc-body">Vierna, Zelus, Osiren, Dolores (and Xaris outside summons) don't exploit AS. If a rule requires AS as essential, their ideal pieces (CC + CD without AS) get recycled: accepted, or plan a dedicated no-AS rule.</div></details>
      <details class="acc"><summary>Presence sets (Morale)</summary><div class="acc-body">The wearer barely matters, only the bonus counts. If the rules on these sets are too strict to gear three pieces on a sacrificial wearer, lower their required to 2 — or gear it with the scraps.</div></details>
      <details class="acc"><summary>Whirlwind (+75 AS)</summary><div class="acc-body">A quad Whirlwind has two outlets — worn as-is to close a difficult 450 budget, or transformed into Warlord / Wicked Vengeance. Decision at resource-spending time, not at sorting time.</div></details>
      <details class="acc"><summary>In-game rule cap</summary><div class="acc-body">If the tool caps out, sacrifice first the rules with the weakest catches or no exclusive catch — the Tester's Coverage mode identifies them directly.</div></details>
      <details class="acc"><summary>Rage Regen Efficiency</summary><div class="acc-body">A single RR in the attribute list. If an RR / RR Efficiency distinction appears in the tool, every rule using RR must be revisited.</div></details>

function route(){

    UI.view = "regles";
    decodeShare(payload)
      .then(txt=>importRulesText(txt))
      .catch(()=>({ok:false, err:t("err_link")}))
      .then(res=>{
        if(res.ok){ UI.open.clear(); scheduleSave(); toast(t("t_import_link", esc(res.tab.name), res.tab.rules.length)); }
        else { toast(t("t_link_fail", esc(res.err))); }

  }

function doCopy(txt, btn){

    setTimeout(()=>{btn.textContent=prev; btn.classList.remove("ok");},1500); };

function slug(x){ return String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "onglet"; }
