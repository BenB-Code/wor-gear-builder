function rand36(n){
  const a = new Uint8Array(n);
  try{ (window.crypto||crypto).getRandomValues(a); }catch(_){ for(let i=0;i<n;i++) a[i] = Math.floor(Math.random()*256); }

  return Array.from(a).map(b=>(b%36).toString(36)).join("");
}
async function shortenShare(longUrl){
  const opts = ms=> (typeof AbortSignal!=="undefined" && AbortSignal.timeout) ? {signal:AbortSignal.timeout(ms)} : {};
  // 1) TinyURL (sans clé) : redirection 301 DIRECTE — pas de page interstitielle, contrairement à
  //    da.gd qui en impose une sur tout lien de moins d'une heure (anti-phishing, non désactivable).
  //    CORS OK (l'ACAO n'est renvoyé que si la requête porte un header Origin — c'est le cas de fetch),
  //    fragment #/import=… conservé, alias perso ; collision d'alias → 422, on retente avec un autre aléa.
  //    Timeout large : le premier hit (DNS+TLS à froid) peut dépasser 5 s, et on retente même sur erreur.
  for(let i=0; i<3; i++){
    try{
      const res = await fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(longUrl) + "&alias=WoR-"+rand36(6), opts(8000));
      if(!res.ok) continue;
      const txt = (await res.text()).trim();
      if(/^https:\/\/tinyurl\.com\/[A-Za-z0-9-]+$/.test(txt)) return txt;
    }catch(_){}
  }
  // 2) Secours : da.gd (CORS * — couvre aussi file:// ; interstitiel la 1re heure, mais lien valide).
  const res = await fetch("https://da.gd/shorten?url=" + encodeURIComponent(longUrl), opts(4500));
  if(!res.ok) throw new Error("short-http-"+res.status);
  const txt = (await res.text()).trim();
  if(!/^https:\/\/da\.gd\/[A-Za-z0-9-]+$/.test(txt)) throw new Error("short-bad");

  return txt;
}
function b64uEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uDecode(b){ b = String(b).replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; return decodeURIComponent(escape(atob(b))); }
function b64uFromBytes(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function bytesFromB64u(b){ b = String(b).replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; const bin = atob(b); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
async function deflateText(str){ const buf = await new Response(new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return b64uFromBytes(new Uint8Array(buf)); }
async function inflateText(b64){ const buf = await new Response(new Blob([bytesFromB64u(b64)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(); return new TextDecoder().decode(buf); }
// ── Codec de partage v2 (lien court) ──
// STAT_CODE est l'ordre FIGÉ des bits des masques — indépendant de ALLSTATS, qui n'est qu'un
// ordre d'affichage : le réordonner ne doit jamais casser les liens déjà partagés.
const STAT_CODE = ["ATK","ATK%","CC","CD","HP","HP%","DEF","DEF%","RR","HE","AS"];
const statMask = arr => arr.reduce((m,s)=>{ const i = STAT_CODE.indexOf(s); return i<0 ? m : m|(1<<i); }, 0);
const statUnmask = m => STAT_CODE.filter((_,i)=>m&(1<<i));
function packTab(tab){ return {v:2, n:tab.name, ...(tab.key?{k:tab.key}:{}), r:tab.rules.map(r=>[r.name, r.sets, statMask(r.mains), statMask(r.pool), statMask(r.ess), r.req, (r.arch&&r.arch.length)?r.arch:0])}; }
function unpackTab(o){ return {name:o.n, key:typeof o.k==="string"?o.k:"", rules:(Array.isArray(o.r)?o.r:[]).map(x=>({name:x[0], sets:Array.isArray(x[1])?x[1]:[], mains:statUnmask(+x[2]||0), pool:statUnmask(+x[3]||0), ess:statUnmask(+x[4]||0), req:+x[5]||1, arch:Array.isArray(x[6])?x[6]:[]}))}; }
async function encodeShare(tab){
  try{ return "2." + await deflateText(JSON.stringify(packTab(tab))); }
  catch(_){ return b64uEncode(JSON.stringify(exportTabObj(tab))); } // navigateur sans CompressionStream : lien long v1
}
async function decodeShare(payload){
  if(payload.startsWith("2.")) return inflateText(payload.slice(2));
  return b64uDecode(payload); // liens v1 (b64 du JSON d'export) toujours acceptés
}
function exportTabObj(tab){
  return { format:"wor-tri-rules", version:1, exported:new Date().toISOString().slice(0,10),
           tab:{ name:tab.name, ...(tab.key?{key:tab.key}:{}), rules:tab.rules.map(r=>{ const {id, ...rest} = r; return rest; }) } };
}
function importRulesText(text){
  let data; try{ data = JSON.parse(text); }catch(e){ return {ok:false, err:t("err_json")}; }
  if(data && data.v===2 && Array.isArray(data.r)) data = unpackTab(data); // lien de partage compact
  const tb = (data && data.format==="wor-tri-rules" && data.tab) ? data.tab : data;
  if(!tb || !Array.isArray(tb.rules)) return {ok:false, err:t("err_struct")};
  const base = String(tb.name||"Import").slice(0,40);
  const name = TABS.some(x=>x.name===base) ? (base+t("import_sfx")).slice(0,40) : base;
  bumpSeqs(); // id d'onglet garanti unique même si le compteur a dérivé
  const nt = newTab(name);
  if(typeof tb.key==="string") nt.key = tb.key.slice(0,60);
  for(const r of tb.rules){
    const rule = sanitizeRule({...(r && typeof r==="object" ? r : {}), id:"TMP"});
    if(rule && rule.sets.length && rule.pool.length){ rule.id = nextRuleId(nt, rule.section); nt.rules.push(rule); }
  }
  if(!nt.rules.length){ TABS.splice(TABS.indexOf(nt),1); ensureTab(); return {ok:false, err:t("err_norules")}; }
  registerArchs();
  activeTabId = nt.id;
  return {ok:true, tab:nt};
}
function finishImport(text){
  const prevActive = activeTabId;
  const res = importRulesText(text);
  if(!res.ok){ toast(t("t_import_fail", esc(res.err))); return; }
  UI.open.clear();
  if(UI.view==="regles"){ renderView(); } else { goto("/regles"); }
  scheduleSave();
  toast(t("t_import_ok", esc(res.tab.name), res.tab.rules.length), {action:{label:t("undo"), fn(){
    const i = TABS.findIndex(x=>x.id===res.tab.id);
    if(i>=0) TABS.splice(i,1);
    ensureTab();
    if(TABS.some(x=>x.id===prevActive)) activeTabId = prevActive;
    UI.open.clear();
    if(UI.view==="regles"){ renderView(); } else { updateSidebar(); }
    scheduleSave();
  }}});
}
function printRule(r){
  let warn = "";
  if(r.req > r.pool.length) warn = ' <span class="pv-warn">'+t("pr_warn")+'</span>';
  else if(r.ess.length > r.req) warn = ' <span class="pv-warn" style="color:#8a6d1f">'+t("pr_eff", r.ess.length)+'</span>';
  const tags = (isEntered(r.id)?'<span class="pv-mod">'+t("pr_entered")+'</span>':'');
  return `<div class="pv-rule">
    <div class="pv-title">${r.id} · ${esc(r.name)}${tags}${warn}</div>
    <div class="pv-line"><span class="pv-k">${t("pr_k_sets")}</span> — ${r.sets.map(setName).join(", ")}</div>
    <div class="pv-line"><span class="pv-k">${t("pr_k_mains")}</span> — ${r.mains.join(" / ")||"—"}</div>
    <div class="pv-line"><span class="pv-k">${t("pr_k_pool")}</span> — ${sortStats(r.pool).join(", ")||"—"} &nbsp;·&nbsp; <span class="pv-k">${t("pr_k_req")}</span> ${r.req} &nbsp;·&nbsp; <span class="pv-k">${t("pr_k_ess")}</span> — ${sortStats(r.ess).join(", ")||"—"}</div>
  </div>`;
}
function printDoc(){
  const tab = activeTab();
  const d = new Date().toLocaleDateString(t("date_locale"),{day:"numeric",month:"long",year:"numeric"});
  const rules = tab ? tab.rules : [];
  const done = rules.filter(r=>isEntered(r.id)).length;
  let body = "";
  for(const sec of SECTIONS){
    const list = rules.filter(r=>r.section===sec);
    if(!list.length) continue;
    body += `<h2>${sideLabel(sec)}</h2>` + list.map(printRule).join("");
  }
  return `<h1>${t("pr_title")}</h1>
  <div class="pv-meta">${t("pr_meta", esc(tab?tab.name:"—"), d, rules.length, done)}</div>
  ${body||"<p>"+t("pr_empty")+"</p>"}
  <div class="pv-foot">${t("pr_foot")}</div>`;
}

/* ══════════════ ÉDITEUR DE RÈGLE (création + modification) ══════════════ */
const AP = { editing:null, side:"right", mains:new Set(), sets:new Set(), arch:new Set(), pool:new Set(), ess:new Set(), req:1 };
function renderAddPanel(){
  const legal = legalMainsForSide(AP.side);
  document.getElementById("ap-mains").innerHTML = legal.map(a=>
    `<button type="button" class="chip ${STAT[a]} pick${AP.mains.has(a)?' sel':''}" data-role="ap-main" data-stat="${a}">${a}</button>`).join("") || `<span class="hint">${t("none_legal")}</span>`;
  document.getElementById("ap-subs").innerHTML = ALLSTATS.map(a=>{
    const cls = AP.ess.has(a) ? " sel ess" : (AP.pool.has(a) ? " sel" : "");
    return `<button type="button" class="chip ${STAT[a]} pick${cls}" data-role="ap-sub" data-stat="${a}">${AP.ess.has(a)?"★ "+a:a}</button>`;
  }).join("");
  document.getElementById("ap-req-val").textContent = AP.req;
  const rw = document.getElementById("ap-req-warn");
  if(AP.req > AP.pool.size){ rw.textContent = t("warn_unplayable").replace("&gt;",">"); rw.style.color = "var(--off)"; }
  else if(AP.ess.size > AP.req){ rw.textContent = t("warn_eff", AP.ess.size); rw.style.color = "var(--faint)"; }
  else { rw.textContent = ""; }
  document.getElementById("ap-arch").innerHTML = allArchs().map(a=>{
    const del = (!ARCHS.includes(a) && !AP.arch.has(a) && !allRules().some(r=>(r.arch||[]).includes(a)))
      ? `<button type="button" class="arch-del" data-delarch="${esc(a)}" title="${t("tip_delrole")}">✕</button>` : "";
    return `<span class="arch-wrap"><button type="button" class="fchip${AP.arch.has(a)?' on':''}" data-role="ap-arch" data-arch="${esc(a)}">${esc(archLabel(a))}</button>${del}</span>`;
  }).join(" ") + (UI.addingRole==="dlg"
    ? ` <input type="text" class="tab-rename arch-input" id="arch-input" data-ctx="dlg" maxlength="20" placeholder="${t("role_ph")}">`
    : ` <button type="button" class="fchip arch-plus" data-archplus="dlg">${t("role_plus")}</button>`);
  document.getElementById("ap-sets-label").textContent = t("sets_lab", AP.side);
  document.getElementById("ap-sets").innerHTML = SIDE_SETS[AP.side].map(n=>
    `<button type="button" class="chip set t${SETTIER[n]} pick${AP.sets.has(n)?' sel':''}" data-role="ap-set" data-set="${esc(n)}" title="${esc((LANG==="fr"&&SET_FR[n]!==n ? n+" — " : "")+setBonus(SET_BY[n]))}">${esc(setName(n))}</button>`).join("");
}
function applySide(side){
  AP.side = side;
  AP.sets = new Set([...AP.sets].filter(n=>SETSIDE[n]===side));
  const legal = legalMainsForSide(side);
  AP.mains = new Set([...AP.mains].filter(a=>legal.includes(a)));
  renderAddPanel();
}
function openDlg(editId){
  const r = editId ? getRule(editId) : null;
  AP.editing = r ? r.id : null;
  AP.side = r ? r.section : (UI.fSection==="left" ? "left" : "right");
  AP.mains = new Set(r ? r.mains : []);
  AP.sets = new Set(r ? r.sets : []);
  AP.arch = new Set(r ? r.arch : []);
  AP.pool = new Set(r ? r.pool : []);
  AP.ess = new Set(r ? r.ess : []);
  AP.req = r ? r.req : 1;
  document.getElementById("ap-name").value = r ? r.name : "";
  document.getElementById("ap-section").value = AP.side;
  document.getElementById("ap-warn").textContent = "";
  document.getElementById("dlg-title").textContent = r ? t("dlg_edit", r.id, r.name) : t("dlg_new");
  document.getElementById("ap-create").textContent = r ? t("btn_save") : t("btn_create");
  renderAddPanel();
  document.getElementById("dlg-overlay").hidden = false;
  document.getElementById("ap-name").focus();
}
function closeDlg(){ document.getElementById("dlg-overlay").hidden = true; AP.editing = null; }
function saveRule(){
  const name = document.getElementById("ap-name").value.trim();
  const sets = sortSets([...AP.sets].filter(n=>SETSIDE[n]===AP.side));
  const legal = legalMainsForSide(AP.side);
  const mainsArr = sortStats([...AP.mains].filter(a=>legal.includes(a)));
  const missing = [];
  if(!name) missing.push(t("miss_name"));
  if(!sets.length) missing.push(t("miss_set"));
  if(!mainsArr.length) missing.push(t("miss_main"));
  if(!AP.pool.size) missing.push(t("miss_sub"));
  if(missing.length){ document.getElementById("ap-warn").textContent = t("miss", missing.join(", ")); return; }
  const pool = sortStats([...AP.pool]);
  const ess = sortStats([...AP.ess].filter(a=>pool.includes(a)));
  const fields = { name, section:AP.side, sets, mains:mainsArr,
                   arch:allArchs().filter(a=>AP.arch.has(a)), pool, ess, req:Math.min(4,Math.max(1,AP.req)) };
  if(AP.editing){
    const r = getRule(AP.editing);
    let id = AP.editing;
    if(r){
      Object.assign(r, fields);
      const m = /^([A-Z]+)(\d+)$/.exec(r.id);
      const want = fields.section==="left" ? "G" : "D";
      if(m && m[1]!==want){
        const tab = activeTab();
        let nid = want + m[2];
        if(tab.rules.some(x=>x!==r && x.id===nid)) nid = nextRuleId(tab, fields.section);
        const ok = entKey(activeTabId, r.id);
        if(ENTERED.has(ok)){ ENTERED.delete(ok); ENTERED.add(entKey(activeTabId, nid)); }
        if(UI.open.has(r.id)){ UI.open.delete(r.id); UI.open.add(nid); }
        r.id = nid; id = nid;
      }
    }
    closeDlg();
    UI.open.add(id); UI.pending = id;
    if(UI.view!=="regles"){ goto("/regles/"+id); } else { renderView(); }
    scheduleSave();
    toast(t("t_rule_updated", id));
  } else {
    ensureTab();
    const id = nextRuleId(activeTab(), AP.side);
    ENTERED.delete(entKey(activeTabId, id)); // un numéro libéré par suppression peut resservir
    activeTab().rules.push({ id, ...fields });
    closeDlg();
    UI.q=""; UI.fSection="all"; UI.fArch="all"; UI.fSet="all"; UI.fTier="all";
    UI.fMain = new Set(); UI.fSubs = new Set();
    UI.open.add(id); UI.pending = id;
    if(UI.view!=="regles"){ goto("/regles/"+id); } else { renderView(); }
    scheduleSave();
    toast(t("t_rule_created", id));
  }
}

/* ══════════════ INTERACTIONS ══════════════ */
function commitRole(ctx, raw){
  const v = String(raw||"").trim().slice(0,20);
  UI.addingRole = null;
  if(v){
    const vl = v.toLowerCase();
    let key = allArchs().find(a=>archLabelIn("fr",a).toLowerCase()===vl || archLabelIn("en",a).toLowerCase()===vl);
    if(!key){ key = v; EXTRA_ARCHS.push(v); }
    if(ctx==="dlg"){ AP.arch.add(key); }
    else {
      const r = getRule(ctx);
      if(r) r.arch = allArchs().filter(x=>(r.arch||[]).includes(x)||x===key);
    }
    scheduleSave();
  }
  if(ctx==="dlg"){ renderAddPanel(); } else { renderView(); }
}
function commitRename(commit){
  const inp = document.getElementById("tab-rename-input");
  if(UI.renaming && inp && commit){
    const t = TABS.find(x=>x.id===UI.renaming);
    if(t) t.name = inp.value.trim().slice(0,40) || t.name;
    scheduleSave();
  }
  UI.renaming = null;
  refreshTabBar(); updateSidebar();
}
document.addEventListener("click", e=>{
  const el = e.target;

  // état ouvert/fermé du panneau de contraintes (sans bloquer le toggle natif)
  const sm = el.closest("summary");
  if(sm && sm.parentElement && sm.parentElement.id==="cons-details"){
    setTimeout(()=>{ const d = document.getElementById("cons-details"); if(d) UI.test.consOpen = d.open; }, 0);
  }
  if(sm && sm.parentElement && sm.parentElement.id==="filters-acc"){
    setTimeout(()=>{ const d = document.getElementById("filters-acc"); if(d) UI.filtersOpen = d.open; }, 0);
  }

  // navigation
  const nav = el.closest(".nav-btn");
  if(nav){ document.body.classList.remove("nav-open"); goto("/"+nav.dataset.nav); return; }
  const ref = el.closest("[data-goto]");
  if(ref){ document.body.classList.remove("nav-open"); goto("/regles/"+ref.dataset.goto); return; }

  // onglets
  const tsel = el.closest("[data-tabsel]");
  if(tsel){
    if(UI.renaming) commitRename(true);
    activeTabId = tsel.dataset.tabsel;
    UI.open.clear();
    refreshTabBar(); updateRuleList(); updateSidebar(); scheduleSave();
    return;
  }
  if(el.closest("#tab-add")){
    const nt = newTab(t("tab_new", TABS.length+1));
    activeTabId = nt.id; UI.open.clear();
    refreshTabBar(); updateRuleList(); updateSidebar(); scheduleSave();
    toast(t("t_tab_created", esc(nt.name)));
    return;
  }
  if(el.closest("#tab-rename")){
    UI.renaming = activeTabId;
    refreshTabBar();
    const inp = document.getElementById("tab-rename-input");
    if(inp){ inp.focus(); inp.select(); }
    return;
  }
  if(el.closest("#tab-dup")){
    const src = activeTab(); if(!src) return;
    const nt = newTab(src.name+t("copy_sfx"));
    nt.key = src.key||"";
    nt.rules = JSON.parse(JSON.stringify(src.rules)); // numérotation par onglet : les ids se conservent tels quels
    activeTabId = nt.id; UI.open.clear();
    refreshTabBar(); updateRuleList(); updateSidebar(); scheduleSave();
    toast(t("t_tab_dup", esc(nt.name)));
    return;
  }
  if(el.closest("#tab-del")){
    const idx = TABS.findIndex(x=>x.id===activeTabId);
    if(idx<0) return;
    const snap = TABS[idx];
    TABS.splice(idx,1);
    ensureTab();
    activeTabId = (TABS[idx]||TABS[idx-1]||TABS[0]).id;
    UI.open.clear();
    refreshTabBar(); updateRuleList(); updateSidebar(); scheduleSave();
    toast(t("t_tab_del", esc(snap.name), snap.rules.length), {action:{label:t("undo"), fn(){
      TABS.splice(Math.min(idx,TABS.length),0,snap);
      activeTabId = snap.id;
      refreshTabBar(); updateRuleList(); updateSidebar(); scheduleSave();
    }}});
    return;
  }

  // filtres règles
  const fs = el.closest("[data-fsection]");
  if(fs){ UI.fSection = fs.dataset.fsection;
    document.querySelectorAll("[data-fsection]").forEach(b=>b.classList.toggle("on", b===fs));
    updateRuleList(); return; }
  const fm = el.closest("[data-fmain]");
  if(fm){
    const a = fm.dataset.fmain;
    UI.fMain.has(a) ? UI.fMain.delete(a) : UI.fMain.add(a);
    if(fm.classList) fm.classList.toggle("sel", UI.fMain.has(a));
    updateRuleList(); return;
  }
  const fsb = el.closest("[data-fsub]");
  if(fsb){
    const a = fsb.dataset.fsub;
    UI.fSubs.has(a) ? UI.fSubs.delete(a) : UI.fSubs.add(a);
    if(fsb.classList) fsb.classList.toggle("sel", UI.fSubs.has(a));
    updateRuleList(); return;
  }
  const fa = el.closest("[data-farch]");
  if(fa){ UI.fArch = fa.dataset.farch;
    document.querySelectorAll("[data-farch]").forEach(b=>b.classList.toggle("on", b===fa));
    updateRuleList(); return; }
  const frt = el.closest("[data-frtier]");
  if(frt){ UI.fTier = frt.dataset.frtier;
    document.querySelectorAll("[data-frtier]").forEach(b=>b.classList.toggle("on", b===frt));
    updateRuleList(); return; }
  const ft = el.closest("[data-ftier]");
  if(ft){ UI.setsTier = ft.dataset.ftier;
    document.querySelectorAll("[data-ftier]").forEach(b=>b.classList.toggle("on", b===ft));
    updateSetsTables(); return; }

  // toolbar règles
  if(el.closest("#add-open") || el.closest("#add-open-empty")){ openDlg(); return; }
  const ta2 = el.closest("#toggle-all");
  if(ta2){
    const tab = activeTab();
    if(UI.open.size){ UI.open.clear(); } else if(tab){ tab.rules.forEach(r=>UI.open.add(r.id)); }
    updateRuleList(); return;
  }

  // dialogue (éditeur de règle)
  if(el.closest("#ap-cancel")){ closeDlg(); return; }
  if(el.closest("#ap-create")){ saveRule(); return; }
  if(el.id === "dlg-overlay"){ closeDlg(); return; }
  const apm = el.closest('[data-role="ap-main"]');
  if(apm){
    const a = apm.dataset.stat;
    if(AP.mains.has(a)){ AP.mains.delete(a); }
    else { AP.mains.add(a); }
    renderAddPanel(); return;
  }
  const apsub = el.closest('[data-role="ap-sub"]');
  if(apsub){
    const a = apsub.dataset.stat;
    if(AP.ess.has(a)){ AP.ess.delete(a); AP.pool.delete(a); }
    else if(AP.pool.has(a)){ AP.ess.add(a); }
    else { AP.pool.add(a); }
    renderAddPanel(); return;
  }
  if(el.closest("#ap-req-minus")){ AP.req = Math.max(1, AP.req-1); renderAddPanel(); return; }
  if(el.closest("#ap-req-plus")){ AP.req = Math.min(4, AP.req+1); renderAddPanel(); return; }
  const rplus = el.closest("[data-archplus]");
  if(rplus){
    UI.addingRole = rplus.dataset.archplus;
    if(UI.addingRole==="dlg"){ renderAddPanel(); } else { rerenderRule(UI.addingRole); }
    const inp = document.getElementById("arch-input");
    if(inp && inp.focus) inp.focus();
    return;
  }
  const darch = el.closest("[data-delarch]");
  if(darch){
    const a = darch.dataset.delarch;
    if(!allRules().some(r=>(r.arch||[]).includes(a))) EXTRA_ARCHS = EXTRA_ARCHS.filter(x=>x!==a);
    scheduleSave(); renderAddPanel(); return;
  }
  const apa = el.closest('[data-role="ap-arch"]');
  if(apa){ AP.arch.has(apa.dataset.arch) ? AP.arch.delete(apa.dataset.arch) : AP.arch.add(apa.dataset.arch); renderAddPanel(); return; }
  const qk = el.closest("[data-quick]");
  if(qk){
    const q = qk.dataset.quick;
    if(q==="clear"){ AP.sets.clear(); }
    else {
      const targets = SIDE_SETS[AP.side].filter(n=>q==="all" || SETTIER[n]===+q);
      const allIn = targets.length>0 && targets.every(n=>AP.sets.has(n));
      targets.forEach(n=> allIn ? AP.sets.delete(n) : AP.sets.add(n));
    }
    renderAddPanel(); return;
  }
  const aps = el.closest('[data-role="ap-set"]');
  if(aps){ AP.sets.has(aps.dataset.set) ? AP.sets.delete(aps.dataset.set) : AP.sets.add(aps.dataset.set); renderAddPanel(); return; }

  // thème & accent
  if(el.closest("#theme-btn")){ theme = (theme==="light")?"dark":"light"; applyTheme(); scheduleSave(); return; }
  if(el.closest("#density-btn")){ DENSITY = DENSITY==="compact" ? "confort" : "compact"; applyTheme(); scheduleSave(); return; }
  const lg = el.closest("[data-lang]");
  if(lg){
    LANG_CHOSEN = true; scheduleSave(); // même re-cliquer la langue active est un choix explicite
    if(LANG!==lg.dataset.lang){
      LANG = lg.dataset.lang==="fr" ? "fr" : "en";
      applyTheme(); applyLang(); scheduleSave(); renderView();
      const ov = document.getElementById("dlg-overlay");
      if(ov && !ov.hidden){
        document.getElementById("dlg-title").textContent = AP.editing ? t("dlg_edit", AP.editing, (getRule(AP.editing)||{name:""}).name) : t("dlg_new");
        document.getElementById("ap-create").textContent = AP.editing ? t("btn_save") : t("btn_create");
        renderAddPanel();
      }
    }
    return;
  }
  const ad = el.closest(".acc-dot");
  if(ad){ ACC = ACCENTS.includes(ad.dataset.acc) ? ad.dataset.acc : "or"; applyTheme(); scheduleSave(); return; }

  // import / export d'onglets
  if(el.closest("#import-btn")){ const fi = document.getElementById("import-file"); if(fi && fi.click) fi.click(); return; }
  const kcp = el.closest("#tab-key-copy");
  if(kcp){
    const tab = activeTab();
    if(tab && tab.key) doCopy(tab.key, kcp);
    else { const inp = document.getElementById("tab-key"); if(inp) inp.focus(); }
    return;
  }
  const tex = el.closest("#tab-export");
  if(tex){
    const tab = activeTab(); if(!tab) return;
    downloadText("wor-regles-"+slug(tab.name)+".json", JSON.stringify(exportTabObj(tab), null, 2));
    toast(t("t_export", esc(tab.name)));
    return;
  }
  const shr = el.closest("#tab-share");
  if(shr){
    const tab = activeTab(); if(!tab) return;
    const prev = shr.textContent;
    const done = ()=>{ shr.disabled = false; shr.textContent = prev; };
    shr.textContent = "…"; shr.disabled = true;
    encodeShare(tab).then(payload=>{
      const url = location.origin + location.pathname + "#/import=" + payload;
      return shortenShare(url)
        .then(su=>{ done(); doCopy(su, shr); toast(t("t_share_short", su), {ttl:7000}); })
        .catch(()=>{ done(); doCopy(url, shr); toast(t(url.length > 6000 ? "t_share_long" : "t_share_ok") + " " + t("t_share_fallback"), {ttl:7500}); });
    }).catch(done);
    return;
  }

  // tiroir mobile
  if(el.closest("#burger")){ document.body.classList.toggle("nav-open"); return; }
  if(el.closest("#scrim")){ document.body.classList.remove("nav-open"); return; }

  // testeur
  const tsm = el.closest("[data-tsmode]");
  if(tsm){ UI.test.mode = tsm.dataset.tsmode; renderView(); return; }
  const tsc = el.closest("[data-tsscope]");
  if(tsc){ UI.test.scopeMode = tsc.dataset.tsscope; updateTestBody(); return; }
  const tsr = el.closest("[data-tssrc]");
  if(tsr){
    UI.test.src = tsr.dataset.tssrc;
    if(UI.test.src==="gd" && UI.test.lvl!=="all" && UI.test.lvl>13) UI.test.lvl = "all"; // les donjons plafonnent au niv. 13
    updateTestBody(); return;
  }
  const tst = el.closest("[data-tstier]");
  if(tst){ const v=tst.dataset.tstier; UI.test.tiers.has(v)?UI.test.tiers.delete(v):UI.test.tiers.add(v); updateTestBody(); return; }
  const tss = el.closest("[data-tsside]");
  if(tss){ const v=tss.dataset.tsside; UI.test.sides.has(v)?UI.test.sides.delete(v):UI.test.sides.add(v); updateTestBody(); return; }
  if(el.closest("#ts-gen")){ generateSample(); updateTestBody(); return; }
  const tsf = el.closest("[data-tsfilter]");
  if(tsf){ UI.test.filter = tsf.dataset.tsfilter; updateTestBody(); return; }
  const ph = el.closest("[data-piece]");
  if(ph){
    const i = +ph.dataset.piece;
    UI.test.openPieces.has(i) ? UI.test.openPieces.delete(i) : UI.test.openPieces.add(i);
    updateTestBody(); return;
  }
  const ms = el.closest("[data-msub]");
  if(ms){
    const a = ms.dataset.msub, subs = UI.test.manual.subs;
    if(subs.includes(a)) UI.test.manual.subs = subs.filter(x=>x!==a);
    else if(subs.length<4) subs.push(a);
    updateTestBody(); return;
  }
  const cs = el.closest("[data-cslot]");
  if(cs){
    const k = cs.dataset.cslot, a = cs.dataset.cstat;
    const arr = CONSTRAINTS[k];
    CONSTRAINTS[k] = arr.includes(a) ? arr.filter(x=>x!==a) : sortStats([...arr, a]);
    scheduleSave(); updateConsPanel(); updateTestBody(); return;
  }
  if(el.closest("#c-reset")){
    CONSTRAINTS = JSON.parse(JSON.stringify(DEFAULT_CONSTRAINTS));
    scheduleSave(); updateConsPanel(); updateTestBody(); return;
  }

  // cartes de règles
  const tog = el.closest(".tog");
  if(tog){
    const r = getRule(tog.dataset.rule), a = tog.dataset.stat;
    if(!r) return;
    if(r.ess.includes(a)){ r.ess=r.ess.filter(x=>x!==a); r.pool=r.pool.filter(x=>x!==a); }
    else if(r.pool.includes(a)){ r.ess=sortStats([...r.ess,a]); }
    else { r.pool=sortStats([...r.pool,a]); }
    rerenderRule(r.id); scheduleSave(); return;
  }
  const minus = el.closest(".st-minus"), plus = el.closest(".st-plus");
  if(minus||plus){
    const r = getRule((minus||plus).dataset.rule);
    if(!r) return;
    r.req = Math.min(4, Math.max(1, r.req + (plus?1:-1)));
    rerenderRule(r.id); scheduleSave(); return;
  }
  const at = el.closest(".arch-tog");
  if(at){
    const r = getRule(at.dataset.archrule);
    if(r){
      const a = at.dataset.arch;
      r.arch = (r.arch||[]).includes(a) ? r.arch.filter(x=>x!==a) : allArchs().filter(x=>(r.arch||[]).includes(x)||x===a);
      rerenderRule(r.id); scheduleSave();
    }
    return;
  }
  const ed = el.closest(".rc-edit");
  if(ed){ openDlg(ed.dataset.rule); return; }
  const dup = el.closest(".rc-dup");
  if(dup){
    const r = getRule(dup.dataset.rule); if(!r) return;
    const tab = tabOfRule(r.id) || activeTab();
    const copy = {...JSON.parse(JSON.stringify(r)), id:nextRuleId(tab, r.section), name:r.name+t("copy_sfx")};
    ENTERED.delete(entKey(tab.id, copy.id)); // un numéro libéré par suppression peut resservir
    const idx = tab.rules.indexOf(r);
    tab.rules.splice(idx+1, 0, copy);
    UI.open.add(copy.id);
    updateRuleList(); refreshTabBar(); updateSidebar(); scheduleSave();
    toast(t("t_rule_dup", copy.id));
    return;
  }
  const del = el.closest(".rc-del");
  if(del){
    const id = del.dataset.rule;
    const tab = tabOfRule(id); if(!tab) return;
    const idx = tab.rules.findIndex(r=>r.id===id);
    const snap = tab.rules[idx];
    tab.rules.splice(idx,1);
    UI.open.delete(id);
    updateRuleList(); refreshTabBar(); updateSidebar(); scheduleSave();
    toast(t("t_rule_del", id), {action:{label:t("undo"), fn(){
      tab.rules.splice(Math.min(idx,tab.rules.length),0,snap);
      updateRuleList(); refreshTabBar(); updateSidebar(); scheduleSave();
    }}});
    return;
  }

  // repli/dépli d'une carte (après tous les contrôles internes)
  const head = el.closest(".row-head");
  if(head && !el.closest("input") && !el.closest(".drag")){
    const id = head.dataset.toggle;
    UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id);
    rerenderRule(id);
    const tg = document.getElementById("toggle-all");
    if(tg) tg.textContent = UI.open.size ? t("btn_collapse") : t("btn_expand");
    return;
  }
});
document.addEventListener("change", e=>{
  const chk = e.target.closest("[data-entered]");
  if(chk){
    const id = chk.dataset.entered;
    chk.checked ? ENTERED.add(entKey(activeTabId, id)) : ENTERED.delete(entKey(activeTabId, id));
    updateSidebar(); scheduleSave();
    return;
  }
  if(e.target.id==="import-file"){
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=> finishImport(String(rd.result||""));
    rd.onerror = ()=> toast(t("t_file_fail"));
    rd.readAsText(f);
    return;
  }
  if(e.target.id==="ts-tab" || e.target.id==="sets-tab"){
    activeTabId = e.target.value; UI.open.clear();
    refreshSampleVerdicts(); scheduleSave(); renderView(); return;
  }
  if(e.target.id==="f-set"){ UI.fSet = e.target.value; updateRuleList(); return; }
  if(e.target.id==="ts-lvl"){ const v = e.target.value; UI.test.lvl = v==="all" ? "all" : +v; updateTestBody(); return; }
  if(e.target.id==="ts-n"){ UI.test.n = +e.target.value; return; }
  if(e.target.id==="ap-section"){ applySide(e.target.value); return; }
  if(e.target.id==="tm-slot"){ UI.test.manual.slot = e.target.value; updateTestBody(); return; }
  if(e.target.id==="tm-set"){ UI.test.manual.set = e.target.value; updateTestBody(); return; }
  if(e.target.id==="tm-main"){ UI.test.manual.main = e.target.value; UI.test.manual.subs = UI.test.manual.subs.filter(s=>s!==e.target.value); updateTestBody(); return; }
});
document.addEventListener("input", e=>{
  if(e.target.id === "rule-q"){ UI.q = e.target.value; updateRuleList(); }
  if(e.target.id === "sets-q"){ UI.setsQ = e.target.value; updateSetsTables(); }
  if(e.target.id === "tab-key"){ const tab = activeTab(); if(tab){ tab.key = e.target.value.slice(0,60); scheduleSave(); } }
});
document.addEventListener("keydown", e=>{
  if(e.target && e.target.id==="arch-input"){
    if(e.key==="Enter"){ e.preventDefault(); commitRole(e.target.dataset.ctx, e.target.value); }
    else if(e.key==="Escape"){ const ctx=e.target.dataset.ctx; UI.addingRole=null; if(ctx==="dlg"){ renderAddPanel(); } else { renderView(); } }
    return;
  }
  if(e.key === "Escape"){
    document.body.classList.remove("nav-open");
    if(UI.renaming){ commitRename(false); return; }
    closeDlg(); return;
  }
  if(e.target && e.target.id==="tab-rename-input"){
    if(e.key==="Enter"){ e.preventDefault(); commitRename(true); }
    return;
  }
  if(e.key === "/" && UI.view==="regles" && !e.target.closest("input,select,textarea")){
    const q = document.getElementById("rule-q");
    if(q){ e.preventDefault(); q.focus(); }
  }
  const head = e.target.closest && e.target.closest(".row-head");
  if(head && (e.key===" "||e.key==="Enter") && !e.target.closest("input,button")){
    e.preventDefault();
    const id = head.dataset.toggle;
    UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id);
    rerenderRule(id);
  }
});
document.addEventListener("focusout", e=>{
  if(e.target && e.target.id==="tab-rename-input"){ setTimeout(()=>{ if(UI.renaming) commitRename(true); }, 120); }
  if(e.target && e.target.id==="arch-input"){
    const ctx = e.target.dataset.ctx;
    setTimeout(()=>{ if(UI.addingRole){ UI.addingRole=null; if(ctx==="dlg"){ renderAddPanel(); } else { renderView(); } } }, 120);
  }
});
let DRAG = null;
function reorderRule(dragId, targetId, before){
  const tab = activeTab(); if(!tab || dragId===targetId) return false;
  const from = tab.rules.findIndex(r=>r.id===dragId);
  if(from<0) return false;
  const rule = tab.rules[from];
  tab.rules.splice(from,1);
  let to = tab.rules.findIndex(r=>r.id===targetId);
  if(to<0){ tab.rules.splice(from,0,rule); return false; }
  if(!before) to++;
  tab.rules.splice(to,0,rule);
  return true;
}
document.addEventListener("dragstart", e=>{
  const h = e.target.closest && e.target.closest("[data-drag]");
  if(!h) return;
  DRAG = h.dataset.drag;
  if(e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", DRAG); }catch(_){} }
  const card = document.getElementById("card-"+DRAG);
  if(card && card.classList) card.classList.add("dragging");
});
document.addEventListener("dragover", e=>{
  if(!DRAG) return;
  const card = e.target.closest && e.target.closest(".rule");
  if(!card || card.id==="card-"+DRAG) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
  const rect = card.getBoundingClientRect ? card.getBoundingClientRect() : null;
  const before = rect ? (e.clientY - rect.top) < rect.height/2 : true;
  if(card.classList){ card.classList.toggle("drop-before", before); card.classList.toggle("drop-after", !before); }
});
document.addEventListener("dragleave", e=>{
  const card = e.target.closest && e.target.closest(".rule");
  if(card && card.classList){ card.classList.remove("drop-before"); card.classList.remove("drop-after"); }
});
document.addEventListener("drop", e=>{
  if(!DRAG) return;
  const card = e.target.closest && e.target.closest(".rule");
  if(!card) return;
  e.preventDefault();
  const targetId = card.id.replace(/^card-/, "");
  const rect = card.getBoundingClientRect ? card.getBoundingClientRect() : null;
  const before = rect ? (e.clientY - rect.top) < rect.height/2 : true;
  if(reorderRule(DRAG, targetId, before)) scheduleSave();
  DRAG = null;
  updateRuleList(); refreshTabBar();
});
document.addEventListener("dragend", ()=>{ if(DRAG){ DRAG = null; updateRuleList(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeprint", ()=>{ const pv = document.getElementById("print-view"); if(pv) pv.innerHTML = printDoc(); });

/* ══════════════ DÉMARRAGE ══════════════ */
try{ if(!location.hash) history.replaceState(null,"","#/regles"); }catch(_){}
ensureTab();
applyTheme();
applyLang();
// restaurer AVANT de router : un boot sur #/import=… doit importer dans les onglets restaurés,
// pas dans un état vide que restoreState écraserait ensuite (l'import serait perdu sans erreur).
restoreState().then(route);
</script>
</body>
</html>
