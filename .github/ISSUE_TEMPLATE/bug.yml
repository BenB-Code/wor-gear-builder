name: 🐛 Signaler un bug
description: Quelque chose ne marche pas comme prévu dans le builder.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Décris le problème — et ce que tu attendais à la place.
      placeholder: "ex. quand je supprime une règle puis Ctrl+Z, la sélection…"
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir la vue…
        2. Cliquer sur…
        3. Constater que…
  - type: input
    id: partage
    attributes:
      label: Lien de partage du jeu de règles concerné
      description: Bouton Partager ▸ Copier le lien — ça aide énormément à reproduire avec tes règles exactes.
      placeholder: "https://benb-code.github.io/wor-gear-builder/#/import=…"
  - type: input
    id: contexte
    attributes:
      label: Navigateur / appareil
      placeholder: "ex. Chrome sur Android, Firefox sur PC"
